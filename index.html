<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cognitive Trace Archive</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f6f8fa;
    color: #24292f;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: #24292f;
    color: #fff;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .3px; flex: 1; }
  header a {
    color: #8b949e;
    font-size: 12px;
    text-decoration: none;
  }
  header a:hover { color: #fff; }
  #btn-refresh {
    background: #373e47;
    border: 1px solid #444c56;
    color: #cdd9e5;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s;
  }
  #btn-refresh:hover { background: #444c56; }
  #btn-refresh:disabled { opacity: .5; cursor: default; }
  #btn-pull {
    background: #373e47;
    border: 1px solid #444c56;
    color: #cdd9e5;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s;
  }
  #btn-pull:hover { background: #444c56; }
  #btn-pull:disabled { opacity: .5; cursor: default; }
  #btn-push-index {
    background: #1c4a2e;
    border: 1px solid #2d6a42;
    color: #cdd9e5;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s;
  }
  #btn-push-index:hover { background: #2a6040; }
  #btn-push-index:disabled { opacity: .5; cursor: default; }

  /* ── Layout ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  aside {
    width: 160px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid #d0d7de;
    overflow-y: auto;
    padding: 8px 0;
  }
  .date-tab {
    display: block;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    border-left: 3px solid transparent;
    color: #57606a;
    line-height: 1.4;
    transition: background .1s;
    user-select: none;
  }
  .date-tab:hover { background: #f6f8fa; color: #24292f; }
  .date-tab.active {
    border-left-color: #0969da;
    background: #ddf4ff;
    color: #0969da;
    font-weight: 600;
  }
  .date-tab .day { font-size: 18px; font-weight: 700; display: block; }
  .date-tab .month { font-size: 11px; color: inherit; opacity: .7; }
  .date-tab .count {
    display: inline-block;
    margin-top: 2px;
    background: #eaeef2;
    color: #57606a;
    border-radius: 10px;
    padding: 0 6px;
    font-size: 10px;
  }
  .date-tab.active .count { background: #b6e3ff; color: #0550ae; }

  /* ── Main content ── */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  #date-heading {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #24292f;
    border-bottom: 1px solid #d0d7de;
    padding-bottom: 10px;
  }

  /* ── Doc cards ── */
  .doc-list { display: flex; flex-direction: column; gap: 12px; }

  .doc-card {
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    padding: 14px 16px;
    transition: box-shadow .15s;
  }
  .doc-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }

  .doc-topic {
    font-size: 11px;
    color: #57606a;
    margin-bottom: 5px;
    font-family: monospace;
  }

  .doc-title-btn {
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    font-size: 14px;
    font-weight: 600;
    color: #0969da;
    cursor: pointer;
    line-height: 1.4;
    margin-bottom: 10px;
    min-height: 1.4em;
    display: block;
    width: 100%;
  }
  .doc-title-btn:hover { text-decoration: underline; }
  .doc-card.done .doc-title-btn {
    color: #8c959f;
    font-weight: 400;
    opacity: 0.7;
  }
  .badge-done {
    background: none;
    color: #b0b8c1;
    border-color: #e2e8ee;
    cursor: pointer;
    font-size: 10px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .badge-done:hover { background: #f6f8fa; color: #57606a; opacity: 1; }
  .doc-card.done .badge-done { color: #57606a; border-color: #c8d0d8; }
  .doc-title-btn.loading {
    background: linear-gradient(90deg, #eaeef2 25%, #d0d7de 50%, #eaeef2 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    border-radius: 4px;
    height: 18px;
    width: 70%;
    color: transparent;
    pointer-events: none;
    cursor: default;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .doc-meta {
    font-size: 11px;
    color: #57606a;
    margin-bottom: 8px;
  }

  /* ── Layer badges ── */
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid transparent;
    transition: opacity .15s;
  }
  .badge:hover { opacity: .8; }
  .badge-layer    { background: #edfcf0; color: #2a7a45; border-color: #b6e8c4; }
  .badge-diff     { background: #fff8c5; color: #7d4e00; border-color: #d4a72c; }
  .badge-conflict { background: #ffd8d3; color: #82071e; border-color: #ff8182; }
  .badge-unreachable {
    background: #f6f8fa;
    color: #8c959f;
    border-color: #d0d7de;
    cursor: default;
    text-decoration: line-through;
  }
  .badge-unreachable:hover { opacity: 1; }
  /* ── Diff indicator on card ── */
  .diff-dot { font-size: 11px; margin-left: 6px; font-weight: 600; }
  .diff-dot.modified { color: #d4a72c; }
  .diff-dot.conflict { color: #cf222e; }
  /* ── Panel commit button ── */
  #btn-panel-commit { background: #fff8c5 !important; color: #7d4e00 !important; border-color: #d4a72c !important; }
  /* ── Commit bar inside viewer panel ── */
  #md-commit-bar {
    display: none;
    flex-shrink: 0;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-bottom: 1px solid #d4a72c;
    background: #fffbdd;
  }
  #md-commit-bar input {
    flex: 1;
    padding: 4px 8px;
    border: 1px solid #d0d7de;
    border-radius: 4px;
    font-size: 12px;
    outline: none;
  }

  /* ── Status messages ── */
  #status {
    padding: 20px 24px;
    font-size: 14px;
    color: #57606a;
  }
  .error-msg {
    background: #fff8f0;
    border: 1px solid #ffa657;
    border-radius: 8px;
    padding: 16px;
    color: #7d4e00;
  }
  .error-msg button {
    margin-top: 10px;
    background: #ffa657;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    color: #fff;
  }

  /* ── MD Viewer Panel ── */
  #md-modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.45);
  }
  #md-backdrop {
    position: fixed;
    inset: 0;
    cursor: pointer;
  }
  #md-panel {
    position: relative;
    z-index: 1;
    width: min(1180px, 92vw);
    height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,.25);
    border-radius: 8px;
  }
  #md-header {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid #d0d7de;
    gap: 8px;
    flex-shrink: 0;
    background: #f6f8fa;
  }
  #md-panel-title {
    flex: 1;
    font-size: 11px;
    color: #57606a;
    font-family: monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #md-close {
    background: none;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
    color: #57606a;
    flex-shrink: 0;
  }
  #md-close:hover { background: #eaeef2; }
  /* edit mode button in viewer */
  .md-header-btn {
    background: none;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
    color: #57606a;
    flex-shrink: 0;
  }
  .md-header-btn:hover { background: #eaeef2; }
  .md-header-btn.primary {
    background: #1f6feb;
    border-color: #388bfd;
    color: #fff;
  }
  .md-header-btn.primary:hover { background: #388bfd; }
  .md-header-btn:disabled { opacity: .5; cursor: default; }
  /* edit textarea */
  #md-edit-area {
    flex: 1;
    padding: 24px 28px;
    font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    border: none;
    outline: none;
    resize: none;
    background: #fff;
    color: #24292f;
  }
  #md-footer {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 10px 16px;
    border-top: 1px solid #d0d7de;
    background: #f6f8fa;
  }
  #md-footer #btn-delete {
    font-size: 12px;
    padding: 5px 12px;
    background: none;
    border: 1px solid #ffb8b8;
    border-radius: 6px;
    color: #cf222e;
    cursor: pointer;
  }
  #md-footer #btn-delete:hover { background: #fff0f0; }

  /* delete zone at bottom of body */
  .md-body-delete-zone {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid #f0d0d0;
    display: flex;
    justify-content: flex-end;
  }
  .md-body-delete-zone button {
    font-size: 12px;
    padding: 5px 14px;
    background: none;
    border: 1px solid #ffb8b8;
    border-radius: 6px;
    color: #cf222e;
    cursor: pointer;
  }
  .md-body-delete-zone button:hover { background: #fff0f0; }
  #md-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    font-size: 14px;
    line-height: 1.7;
  }
  #md-body h1,#md-body h2,#md-body h3,#md-body h4 { margin: 1em 0 .4em; color: #24292f; }
  #md-body h1 { font-size: 1.5em; border-bottom: 1px solid #d0d7de; padding-bottom: .3em; }
  #md-body h2 { font-size: 1.2em; border-bottom: 1px solid #eaecef; padding-bottom: .2em; }
  #md-body p { margin: .5em 0; }
  #md-body ul,#md-body ol { margin: .4em 0 .4em 1.5em; }
  #md-body li { margin: .2em 0; }
  #md-body code {
    background: #f6f8fa; border: 1px solid #d0d7de;
    border-radius: 4px; padding: 1px 5px;
    font-size: .88em; font-family: monospace;
  }
  #md-body pre {
    background: #f6f8fa; border: 1px solid #d0d7de;
    border-radius: 6px; padding: 14px;
    overflow-x: auto; margin: .8em 0;
  }
  #md-body pre code { background: none; border: none; padding: 0; font-size: .85em; }
  #md-body blockquote {
    border-left: 4px solid #d0d7de;
    padding-left: 12px; color: #57606a; margin: .5em 0;
  }
  #md-body hr { border: none; border-top: 1px solid #d0d7de; margin: 1em 0; }
  #md-body a { color: #0969da; }
  #md-body table { border-collapse: collapse; width: 100%; margin: .8em 0; }
  #md-body th,#md-body td { border: 1px solid #d0d7de; padding: 6px 12px; font-size: 13px; }
  #md-body th { background: #f6f8fa; font-weight: 600; }

  /* ── Delete confirm dialog ── */
  #delete-dialog {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.55);
  }
  #delete-dialog.open { display: flex; }
  #delete-dialog-box {
    background: #fff;
    border-radius: 10px;
    padding: 28px 28px 24px;
    width: min(420px, 90vw);
    box-shadow: 0 8px 40px rgba(0,0,0,.3);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #delete-dialog-box h3 { font-size: 16px; color: #cf222e; margin: 0; }
  #delete-dialog-box p  { font-size: 13px; color: #24292f; margin: 0; line-height: 1.6; }
  #delete-dialog-confirm-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f6f8fa;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    color: #57606a;
  }
  #delete-dialog-confirm-row code { font-weight: 700; color: #cf222e; letter-spacing: .5px; }
  #btn-copy-confirm-word {
    background: none;
    border: 1px solid #d0d7de;
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 11px;
    cursor: pointer;
    color: #57606a;
    flex-shrink: 0;
  }
  #btn-copy-confirm-word:hover { background: #eaeef2; }
  #delete-confirm-input {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    box-sizing: border-box;
  }
  #delete-confirm-input:focus { border-color: #cf222e; }
  #delete-dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  #btn-delete-confirm-ok {
    background: #cf222e;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 18px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  #btn-delete-confirm-ok:hover:not(:disabled) { background: #a40e26; }
  #btn-delete-confirm-ok:disabled { opacity: .5; cursor: default; }
  #btn-delete-cancel {
    background: none;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
    color: #57606a;
  }
  #btn-delete-cancel:hover { background: #eaeef2; }

  /* ── Links badge on card ── */
  .badge-links {
    background: #f0f3ff;
    color: #0550ae;
    border-color: #b6d0f7;
    cursor: default;
    font-size: 11px;
  }
  .badge-links:hover { opacity: 1; }

  /* ── Fast custom tooltip ── */
  #_tip {
    position: fixed;
    z-index: 9999;
    background: #24292f;
    color: #f0f6fc;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 5px;
    pointer-events: none;
    white-space: pre-wrap;
    max-width: 480px;
    word-break: break-all;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    opacity: 0;
    transition: opacity .1s;
  }
  #_tip.visible { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>📚 Cognitive Trace Archive</h1>
  <a href="https://github.com/lulufoo/cognitive-trace-archive" target="_blank">GitHub ↗</a>
  <button id="btn-refresh">⟳ 刷新</button>
  <button id="btn-pull">↓ 更新项目</button>
  <button id="btn-push-index">↑ Push index</button>
</header>

<div class="layout">
  <aside id="sidebar">
    <div style="padding:12px 16px;font-size:11px;color:#8c959f;">加载中…</div>
  </aside>
  <main id="main">
    <div id="status"><div style="color:#8c959f;font-size:13px;">← 选择日期查看文档</div></div>
    <div id="date-heading" style="display:none"></div>
    <div id="doc-list" class="doc-list"></div>
  </main>
</div>

<!-- MD Viewer -->
<div id="md-modal" style="display:none">
  <div id="md-backdrop"></div>
  <div id="md-panel">
    <div id="md-header">
      <span id="md-panel-title"></span>
      <span id="md-file-size" style="font-size:10px;color:#8c959f;flex-shrink:0;"></span>
      <a id="md-github-link" href="#" target="_blank" style="font-size:12px;color:#0969da;text-decoration:none;flex-shrink:0;">GitHub ↗</a>
      <button class="md-header-btn" id="btn-copy-http" data-tip="">&#127760;</button>
      <button class="md-header-btn" id="btn-copy-path" data-tip="">&#128194;</button>
      <button class="md-header-btn" id="btn-edit">✏️ 编辑</button>
      <button class="md-header-btn primary" id="btn-save" style="display:none">💾 保存</button>
      <button class="md-header-btn" id="btn-cancel-edit" style="display:none">取消</button>
      <button class="md-header-btn" id="btn-panel-commit" style="display:none">● 提交此文件</button>
      <button id="md-close" class="md-header-btn">✕ 关闭</button>
    </div>
    <div id="md-commit-bar">
      <span style="font-size:12px;color:#7d4e00;flex-shrink:0;">● 待提交：</span>
      <input id="md-commit-msg" type="text" placeholder="update: edit via viewer" />
      <button id="btn-commit-file" class="md-header-btn primary" style="font-size:11px;padding:3px 10px;">↑ 提交</button>
      <button id="btn-skip-commit" class="md-header-btn" style="font-size:11px;padding:3px 10px;">稍后</button>
      <span id="md-commit-result" style="font-size:11px;"></span>
    </div>
    <div id="md-links-bar" style="display:none;padding:8px 20px;border-bottom:1px solid #d0d7de;display:flex;align-items:center;flex-wrap:wrap;gap:4px 0;"></div>
    <div id="md-body"></div>
    <textarea id="md-edit-area" style="display:none" spellcheck="false"></textarea>
  </div>
</div>

<!-- Delete confirm dialog -->
<div id="delete-dialog">
  <div id="delete-dialog-box">
    <h3>⚠️ 删除文档</h3>
    <p id="delete-dialog-desc">将删除此条目的所有关联文件（raw / distilled / trace / digest）并从 index.json 移除，<strong>不可撤销</strong>。</p>
    <div id="delete-dialog-confirm-row">
      输入 <code>CONFIRM</code> 确认删除
      <button id="btn-copy-confirm-word" title="复制 CONFIRM">复制</button>
    </div>
    <input id="delete-confirm-input" type="text" placeholder="在此输入 CONFIRM" autocomplete="off" />
    <div id="delete-dialog-actions">
      <button id="btn-delete-cancel">取消</button>
      <button id="btn-delete-confirm-ok" disabled>确认删除</button>
    </div>
  </div>
</div>

<script>
const REPO = 'https://github.com/lulufoo/cognitive-trace-archive/blob/main';
const LAYERS = ['raw', 'distilled', 'digest', 'trace'];
// Cache: date string -> Map<id, title>
const titleCache = new Map();

// Diff status: filepath → 'modified' | 'conflict'
let diffStatus = new Map();

let indexData = null;    // full entries object
let groupedByDate = [];  // [{date, entries:[{id, entry}]}] sorted desc
let activeDate = null;
let archiveRoot = '';    // loaded from /api/config

// ── Diff helpers ───────────────────────────────────────────────────────────────────

function getEntryDiffState(entry) {
  let state = null;
  for (const layer of LAYERS) {
    if (!entry[layer]) continue;
    const s = diffStatus.get(`${layer}/${entry.common_path}`);
    if (s === 'conflict') return 'conflict';
    if (s === 'modified') state = 'modified';
  }
  return state;
}

function getLayerBadgeClass(layer, entry) {
  const s = diffStatus.get(`${layer}/${entry.common_path}`);
  if (s === 'conflict') return 'badge-conflict';
  if (s === 'modified') return 'badge-diff';
  return 'badge-layer';
}

async function loadDiffStatus() {
  try {
    const res = await fetch('/api/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    if (!res.ok) return;
    const data = await res.json();
    diffStatus.clear();
    for (const p of (data.modified || [])) diffStatus.set(p, 'modified');
    for (const p of (data.conflicted || [])) diffStatus.set(p, 'conflict');
  } catch { /* non-critical, server may not support */ }
}

function updateDiffInDOM() {
  if (!activeDate) return;
  const group = groupedByDate.find(g => g.date === activeDate);
  if (!group) return;
  for (const { id, entry } of group.entries) {
    const card = document.querySelector(`.doc-card[data-id="${id}"]`);
    if (!card) continue;
    const metaEl = card.querySelector('.doc-meta');
    if (metaEl) {
      const state = getEntryDiffState(entry);
      const dotHtml = state
        ? ` <span class="diff-dot ${state}">${state === 'conflict' ? '● conflict' : '● 待提交'}</span>`
        : '';
      metaEl.innerHTML = timeFromTs(entry.created_at) + dotHtml;
    }
    const badgesEl = card.querySelector('.badges');
    if (badgesEl) {
      badgesEl.innerHTML = LAYERS
        .filter(layer => entry[layer] === true)
        .map(layer => {
          if (entry[`_unreachable_${layer}`]) {
            return `<span class="badge badge-unreachable" title="文件不可达">${layer}</span>`;
          }
          return `<button class="badge ${getLayerBadgeClass(layer, entry)}" data-layer="${layer}">${layer}</button>`;
        })
        .join('');
      attachBadgeListeners(card, entry);
    }
  }
}

// ── Utils ──────────────────────────────────────────────────────────────────

function slugToTitle(slug) {
  return slug
    .replace(/^\d{12}-/, '')                     // strip timestamp prefix if any
    .split('-')
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(' ');
}

function filenameFromPath(commonPath) {
  return commonPath.split('/').pop().replace(/\.md$/, '');
}

function topicFromPath(commonPath) {
  const parts = commonPath.split('/');
  parts.pop();
  return parts.join('/');
}

function formatDate(dateStr) {
  // dateStr = 'YYYYMMDD'
  const y = dateStr.slice(0, 4);
  const m = dateStr.slice(4, 6);
  const d = dateStr.slice(6, 8);
  const dt = new Date(`${y}-${m}-${d}`);
  const days = ['日','一','二','三','四','五','六'];
  const dow = days[dt.getDay()];
  return {
    day: `${parseInt(d)}日`,
    label: `${parseInt(m)}月${parseInt(d)}日`,
    year: y,
    month: `${y}/${m}`,
    weekday: `周${dow}`,
    full: `${y}年${parseInt(m)}月${parseInt(d)}日（周${dow}）`
  };
}

function timeFromTs(ts) {
  // ts = 'YYYYMMDDHHMM'
  return ts.slice(8, 10) + ':' + ts.slice(10, 12);
}

// ── Fetch index.json ───────────────────────────────────────────────────────

async function loadIndex() {
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true;
  btn.textContent = '⟳ 加载中…';

  try {
    const res = await fetch('./index.json?_=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    indexData = data.entries || data;  // support both {entries:{}} and flat {}
    buildGroups();
    renderSidebar();
    await loadDiffStatus();
    if (groupedByDate.length > 0) selectDate(groupedByDate[0].date);
  } catch (e) {
    showError(`无法加载 index.json：${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = '⟳ 刷新';
  }
}

function buildGroups() {
  const map = new Map();
  for (const [id, entry] of Object.entries(indexData)) {
    const date = entry.created_at.slice(0, 8);
    if (!map.has(date)) map.set(date, []);
    map.get(date).push({ id, entry });
  }
  // Sort each group by created_at desc, then dates desc
  groupedByDate = [...map.entries()]
    .sort((a, b) => b[0].localeCompare(a[0]))
    .map(([date, entries]) => ({
      date,
      entries: entries.sort((a, b) => b.entry.created_at.localeCompare(a.entry.created_at))
    }));
}

// ── Sidebar ────────────────────────────────────────────────────────────────

function renderSidebar() {
  const aside = document.getElementById('sidebar');
  aside.innerHTML = '';
  for (const { date, entries } of groupedByDate) {
    const d = formatDate(date);
    const tab = document.createElement('div');
    tab.className = 'date-tab';
    tab.dataset.date = date;
    tab.innerHTML = `
      <span class="day">${d.label}</span>
      <span class="month">${d.year} ${d.weekday}</span>
      <span class="count">${entries.length}</span>
    `;
    tab.addEventListener('click', () => selectDate(date));
    aside.appendChild(tab);
  }
}

// ── Select date ────────────────────────────────────────────────────────────

function selectDate(date) {
  activeDate = date;

  // Update active tab
  document.querySelectorAll('.date-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.date === date);
  });

  const group = groupedByDate.find(g => g.date === date);
  if (!group) return;

  const d = formatDate(date);
  document.getElementById('status').style.display = 'none';
  const heading = document.getElementById('date-heading');
  heading.style.display = '';
  heading.textContent = d.full + `  ·  ${group.entries.length} 篇`;

  renderDocList(group.entries, date);
  loadTitles(group.entries, date);
}

// ── Doc list ───────────────────────────────────────────────────────────────

function renderDocList(entries, date) {
  const list = document.getElementById('doc-list');
  list.innerHTML = '';

  for (const { id, entry } of entries) {
    const card = buildCard(id, entry, titleCache.get(date)?.get(id));
    list.appendChild(card);
  }
}

function buildCard(id, entry, title) {
  const card = document.createElement('div');
  card.className = 'doc-card';
  card.dataset.id = id;
  entry._id = id;  // attach id for later lookup

  const topic = topicFromPath(entry.common_path);
  const filename = filenameFromPath(entry.common_path);
  const displayTitle = title !== undefined ? title : null;
  const time = timeFromTs(entry.created_at);

  const state = getEntryDiffState(entry);
  const dotHtml = state
    ? ` <span class="diff-dot ${state}">${state === 'conflict' ? '● conflict' : '● 待提交'}</span>`
    : '';

  const badgesHtml = LAYERS
    .filter(layer => entry[layer] === true)
    .map(layer => {
      if (entry[`_unreachable_${layer}`]) {
        return `<span class="badge badge-unreachable" title="文件不可达">${layer}</span>`;
      }
      return `<button class="badge ${getLayerBadgeClass(layer, entry)}" data-layer="${layer}">${layer}</button>`;
    })
    .join('');

  const linkCount = entry.links && entry.links.length;
  const linksBadgeHtml = linkCount
    ? `<span class="badge badge-links" title="${linkCount} 个关联链接">👍 ×${linkCount}</span>`
    : '';

  const doneBadgeHtml = entry.done
    ? `<button class="badge badge-done" data-action="toggle-done" title="标记为未处理">✓ 已处理</button>`
    : `<button class="badge badge-done" data-action="toggle-done" title="标记为已处理">○ 处理</button>`;

  card.innerHTML = `
    <div class="doc-topic">${topic}</div>
    <button class="doc-title-btn${displayTitle === null ? ' loading' : ''}">${displayTitle !== null ? escHtml(displayTitle) : ''}</button>
    <div class="doc-meta">${time}${dotHtml}</div>
    <div class="badges">${badgesHtml}${linksBadgeHtml}${doneBadgeHtml}</div>
  `;
  if (entry.done) card.classList.add('done');
  const firstLayer = LAYERS.find(l => entry[l] === true) || 'raw';
  card.querySelector('.doc-title-btn').addEventListener('click', () => openDoc(entry, firstLayer));
  attachBadgeListeners(card, entry);
  card.querySelector('[data-action="toggle-done"]').addEventListener('click', () => toggleDone(entry, card));
  return card;
}

function attachBadgeListeners(card, entry) {
  card.querySelectorAll('.badge[data-layer]').forEach(btn => {
    btn.addEventListener('click', () => openDoc(entry, btn.dataset.layer));
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Title loading ──────────────────────────────────────────────────────────

async function loadTitles(entries, date) {
  if (titleCache.has(date)) {
    updateTitlesInDOM(date);
    return;
  }

  titleCache.set(date, new Map());

  await Promise.all(entries.map(async ({ id, entry }) => {
    if (!entry.raw) {
      // No raw file: fallback to slug
      const title = slugToTitle(filenameFromPath(entry.common_path));
      titleCache.get(date).set(id, title);
      return;
    }

    const url = `./raw/${entry.common_path}`;
    try {
      const res = await fetch(url);
      if (!res.ok) {
        // Mark raw as unreachable in a non-destructive way
        entry._unreachable_raw = true;
        titleCache.get(date).set(id, slugToTitle(filenameFromPath(entry.common_path)));
        return;
      }
      const text = await res.text();
      const h1Match = text.match(/^#\s+(.+)/m);
      const title = h1Match ? h1Match[1].trim() : slugToTitle(filenameFromPath(entry.common_path));
      titleCache.get(date).set(id, title);
    } catch {
      titleCache.get(date).set(id, slugToTitle(filenameFromPath(entry.common_path)));
    }
  }));

  // Only update DOM if this date is still active
  if (activeDate === date) updateTitlesInDOM(date);
}

function updateTitlesInDOM(date) {
  const cache = titleCache.get(date);
  if (!cache) return;
  const group = groupedByDate.find(g => g.date === date);
  if (!group) return;

  for (const { id, entry } of group.entries) {
    const card = document.querySelector(`.doc-card[data-id="${id}"]`);
    if (!card) continue;

    const titleEl = card.querySelector('.doc-title-btn');
    if (titleEl) {
      titleEl.classList.remove('loading');
      titleEl.textContent = cache.get(id) || slugToTitle(filenameFromPath(entry.common_path));
    }

    // Re-render badges if unreachable state changed
    const badgesEl = card.querySelector('.badges');
    if (badgesEl) {
      const layerHtml = LAYERS
        .filter(layer => entry[layer] === true)
        .map(layer => {
          if (entry[`_unreachable_${layer}`]) {
            return `<span class="badge badge-unreachable" title="文件不可达">${layer}</span>`;
          }
          return `<button class="badge ${getLayerBadgeClass(layer, entry)}" data-layer="${layer}">${layer}</button>`;
        })
        .join('');
      const linkCount = entry.links && entry.links.length;
      const linksBadgeHtml = linkCount
        ? `<span class="badge badge-links" title="${linkCount} 个关联链接">👍 ×${linkCount}</span>`
        : '';
      const doneBadgeHtml = entry.done
        ? `<button class="badge badge-done" data-action="toggle-done" title="标记为未处理">✓ 已处理</button>`
        : `<button class="badge badge-done" data-action="toggle-done" title="标记为已处理">○ 处理</button>`;
      badgesEl.innerHTML = layerHtml + linksBadgeHtml + doneBadgeHtml;
      attachBadgeListeners(card, entry);
      card.classList.toggle('done', !!entry.done);
      card.querySelector('[data-action="toggle-done"]').addEventListener('click', () => toggleDone(entry, card));
    }
  }
}

// ── Error display ──────────────────────────────────────────────────────────

function showError(msg) {
  const status = document.getElementById('status');
  status.style.display = '';
  status.innerHTML = `<div class="error-msg">${escHtml(msg)}<br><button onclick="loadIndex()">重试</button></div>`;
  document.getElementById('date-heading').style.display = 'none';
  document.getElementById('doc-list').innerHTML = '';
}

// ── Refresh ────────────────────────────────────────────────────────────────

document.getElementById('btn-refresh').addEventListener('click', () => {
  titleCache.clear();
  // Reset unreachable flags
  if (indexData) {
    for (const entry of Object.values(indexData)) {
      LAYERS.forEach(l => delete entry[`_unreachable_${l}`]);
    }
  }
  loadIndex();
});

// ── MD Viewer ─────────────────────────────────────────────────────────────

function resolveRelativeLink(href, currentLayer, commonPath) {
  // Resolve relative MD links to absolute GitHub blob URLs
  try {
    const base = `http://x/${currentLayer}/${commonPath}`;
    const resolved = new URL(href, base);
    const repoPath = resolved.pathname.slice(1); // strip leading /
    return `${REPO}/${repoPath}`;
  } catch {
    return null;
  }
}

function postProcessLinks(container, currentLayer, commonPath) {
  container.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (!href || href.startsWith('#')) return;
    if (href.startsWith('http://') || href.startsWith('https://')) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      return;
    }
    // Relative link → resolve to GitHub blob URL
    const ghUrl = resolveRelativeLink(href, currentLayer, commonPath);
    if (ghUrl) {
      a.href = ghUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
  });
}

// ── Current viewer state ───────────────────────────────────────────────────

let currentEntry = null;
let currentLayer = 'raw';
let currentRawText = '';

// ── Open doc ───────────────────────────────────────────────────────────────

function openDoc(entry, layer = 'raw') {
  currentEntry = entry;
  currentLayer = layer;
  exitEditMode(false);
  hideCommitBar();

  const modal = document.getElementById('md-modal');
  const body = document.getElementById('md-body');
  document.getElementById('md-panel-title').textContent = filenameFromPath(entry.common_path).replace(/\.md$/, '');
  const githubUrl = `${REPO}/${layer}/${entry.common_path}`;
  document.getElementById('md-github-link').href = githubUrl;
  document.getElementById('btn-copy-http').dataset.url = githubUrl;
  document.getElementById('btn-copy-http').dataset.tip = githubUrl;
  const relPath = `${layer}/${entry.common_path}`;
  const fullPath = archiveRoot ? `${archiveRoot}/${relPath}` : relPath;
  document.getElementById('btn-copy-path').dataset.tip = fullPath;
  document.getElementById('md-file-size').textContent = '';
  body.innerHTML = '<div style="color:#8c959f;padding:20px;font-size:13px;">加载中…</div>';
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  fetch(`./${layer}/${entry.common_path}?t=${Date.now()}`)
    .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.text(); })
    .then(text => {
      currentRawText = text;
      const bytes = new Blob([text]).size;
      document.getElementById('md-file-size').textContent = bytes < 1024
        ? `${bytes} B`
        : bytes < 1024 * 1024
          ? `${(bytes / 1024).toFixed(1)} KB`
          : `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      renderDocBody(text, layer, entry.common_path);
      const hasDiff = diffStatus.get(`${layer}/${entry.common_path}`);
      document.getElementById('btn-panel-commit').style.display = hasDiff ? '' : 'none';
    })
    .catch(e => {
      body.innerHTML = `<div style="color:#7d4e00;padding:20px">无法加载文件：${escHtml(e.message)}</div>`;
      document.getElementById('btn-edit').style.display = 'none';
    });
}

function renderDocBody(text, layer, commonPath) {
  const body = document.getElementById('md-body');
  if (typeof marked !== 'undefined') {
    body.innerHTML = marked.parse(text);
  } else {
    body.innerHTML = `<pre style="white-space:pre-wrap;font-size:13px">${escHtml(text)}</pre>`;
  }
  postProcessLinks(body, layer, commonPath);
  document.getElementById('btn-edit').style.display = '';
  renderLinksBar(currentEntry);
  // Append delete button at end of content
  const zone = document.createElement('div');
  zone.className = 'md-body-delete-zone';
  const delBtn = document.createElement('button');
  delBtn.id = 'btn-delete';
  delBtn.textContent = '🗑 删除此文档';
  delBtn.title = '删除此条目的所有关联文件';
  delBtn.addEventListener('click', openDeleteDialog);
  zone.appendChild(delBtn);
  body.appendChild(zone);
}

// ── Edit mode ──────────────────────────────────────────────────────────────

function enterEditMode() {
  const editArea = document.getElementById('md-edit-area');
  const body = document.getElementById('md-body');
  editArea.value = currentRawText;
  body.style.display = 'none';
  editArea.style.display = '';
  requestAnimationFrame(() => { editArea.scrollTop = 0; });
  editArea.focus();
  document.getElementById('btn-edit').style.display = 'none';
  document.getElementById('btn-panel-commit').style.display = 'none';
  document.getElementById('btn-save').style.display = '';
  document.getElementById('btn-cancel-edit').style.display = '';
  document.getElementById('md-github-link').style.display = 'none';
  hideCommitBar();
}

function exitEditMode(rerender = true) {
  const editArea = document.getElementById('md-edit-area');
  const body = document.getElementById('md-body');
  editArea.style.display = 'none';
  body.style.display = '';
  document.getElementById('btn-edit').style.display = '';
  document.getElementById('btn-save').style.display = 'none';
  document.getElementById('btn-cancel-edit').style.display = 'none';
  document.getElementById('btn-panel-commit').style.display = 'none';
  document.getElementById('md-github-link').style.display = '';
  if (rerender && currentEntry) {
    renderDocBody(currentRawText, currentLayer, currentEntry.common_path);
  }
}

async function saveDoc() {
  if (!currentEntry) return;
  const editArea = document.getElementById('md-edit-area');
  const newContent = editArea.value;
  const btnSave = document.getElementById('btn-save');
  btnSave.disabled = true;
  btnSave.textContent = '保存中…';

  try {
    const res = await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ layer: currentLayer, common_path: currentEntry.common_path, content: newContent })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

    currentRawText = newContent;
    const date = currentEntry.created_at.slice(0, 8);
    // Update title cache from new content's H1
    const h1Match = newContent.match(/^#\s+(.+)/m);
    const newTitle = h1Match ? h1Match[1].trim() : slugToTitle(filenameFromPath(currentEntry.common_path));
    if (!titleCache.has(date)) titleCache.set(date, new Map());
    titleCache.get(date).set(getEntryId(currentEntry), newTitle);
    // Update card title in DOM directly
    const card = document.querySelector(`.doc-card[data-id="${getEntryId(currentEntry)}"]`);
    if (card) {
      const titleEl = card.querySelector('.doc-title-btn');
      if (titleEl) { titleEl.classList.remove('loading'); titleEl.textContent = newTitle; }
    }
    exitEditMode(true);
    await loadDiffStatus();
    updateDiffInDOM();
    showCommitBar();
  } catch (e) {
    alert(`保存失败：${e.message}\n\n请确认已通过 python3 server.py 启动服务器。`);
  } finally {
    btnSave.disabled = false;
    btnSave.textContent = '💾 保存';
  }
}

document.getElementById('btn-copy-http').addEventListener('click', () => {
  const url = document.getElementById('btn-copy-http').dataset.url || '';
  if (!url) return;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('btn-copy-http');
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = '🌐'; }, 1200);
  });
});

document.getElementById('btn-copy-path').addEventListener('click', () => {
  const relPath = `${currentLayer}/${currentEntry.common_path}`;
  const fullPath = archiveRoot ? `${archiveRoot}/${relPath}` : relPath;
  navigator.clipboard.writeText(fullPath).then(() => {
    const btn = document.getElementById('btn-copy-path');
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = '📂'; }, 1200);
  });
});

// ── Links bar ─────────────────────────────────────────────────────────────

const titleFetchCache = new Map();

async function fetchTitle(url) {
  if (titleFetchCache.has(url)) return titleFetchCache.get(url);
  try {
    const res = await fetch(`/api/fetch-title?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    const title = data.title || fallbackTitle(url);
    titleFetchCache.set(url, title);
    return title;
  } catch {
    return fallbackTitle(url);
  }
}

function fallbackTitle(url) {
  try {
    return decodeURIComponent(new URL(url).pathname.split('/').filter(Boolean).pop()).replace(/\.md$/, '');
  } catch { return url; }
}

function renderLinksBar(entry) {
  const bar = document.getElementById('md-links-bar');
  bar.innerHTML = '';
  const links = entry && entry.links;

  // Add-link button
  const addBtn = document.createElement('button');
  addBtn.className = 'md-header-btn';
  addBtn.style.cssText = 'font-size:11px;padding:2px 8px;margin-left:auto;flex-shrink:0;';
  addBtn.textContent = '＋ 添加链接';
  addBtn.addEventListener('click', () => showAddLinkInput(entry, bar));

  if (!links || links.length === 0) {
    bar.style.display = 'flex';
    bar.appendChild(addBtn);
    return;
  }

  bar.style.display = 'flex';
  for (let i = 0; i < links.length; i++) {
    const link = links[i];
    const wrap = document.createElement('span');
    wrap.style.cssText = 'display:inline-flex;align-items:center;gap:4px;margin-right:12px;flex-shrink:0;';

    const a = document.createElement('a');
    a.href = link.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.cssText = 'font-size:12px;color:#0969da;text-decoration:none;';
    a.textContent = '🔗 加载中…';
    fetchTitle(link.url).then(t => { a.textContent = `🔗 ${t} ↗`; });

    const delBtn = document.createElement('button');
    delBtn.style.cssText = 'font-size:10px;line-height:1;padding:1px 4px;border:1px solid #d0d7de;border-radius:3px;background:#fff;color:#8c959f;cursor:pointer;opacity:0.6;';
    delBtn.textContent = '×';
    delBtn.title = '删除此链接';
    delBtn.addEventListener('click', () => confirmDeleteLink(entry, i, bar, wrap));

    wrap.append(a, delBtn);
    bar.appendChild(wrap);
  }
  bar.appendChild(addBtn);
}

function showAddLinkInput(entry, bar) {
  // Prevent duplicate input
  if (bar.querySelector('.links-input-row')) return;
  const row = document.createElement('div');
  row.className = 'links-input-row';
  row.style.cssText = 'display:flex;align-items:center;gap:6px;margin-top:4px;width:100%;';

  const input = document.createElement('input');
  input.type = 'url';
  input.placeholder = '粘贴 GitHub 链接…';
  input.style.cssText = 'flex:1;font-size:12px;padding:3px 8px;border:1px solid #d0d7de;border-radius:4px;';

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'md-header-btn primary';
  confirmBtn.style.cssText = 'font-size:11px;padding:2px 8px;';
  confirmBtn.textContent = '确认';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'md-header-btn';
  cancelBtn.style.cssText = 'font-size:11px;padding:2px 8px;';
  cancelBtn.textContent = '取消';

  const preview = document.createElement('span');
  preview.style.cssText = 'font-size:11px;color:#57606a;';

  row.append(input, confirmBtn, cancelBtn, preview);
  bar.appendChild(row);
  input.focus();

  let resolvedTitle = '';
  let fetchTimer = null;
  input.addEventListener('input', () => {
    clearTimeout(fetchTimer);
    preview.textContent = '';
    resolvedTitle = '';
    const url = input.value.trim();
    if (!url) return;
    fetchTimer = setTimeout(async () => {
      preview.textContent = '获取标题中…';
      resolvedTitle = await fetchTitle(url);
      preview.textContent = `→ 🔗 ${resolvedTitle} ↗`;
    }, 500);
  });

  cancelBtn.addEventListener('click', () => row.remove());

  confirmBtn.addEventListener('click', async () => {
    const url = input.value.trim();
    if (!url) return;

    // Duplicate check
    const existingLinks = entry.links || [];
    if (existingLinks.some(l => l.url === url)) {
      preview.textContent = '链接已存在';
      return;
    }

    if (!resolvedTitle) resolvedTitle = await fetchTitle(url);
    const newLinks = [...existingLinks, { url }];

    try {
      const res = await fetch('/api/update-links', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: getEntryId(entry), links: newLinks })
      });
      const data = await res.json();
      if (data.ok) {
        entry.links = newLinks;
        titleFetchCache.set(url, resolvedTitle);
        updateCardLinksBadge(entry);
        renderLinksBar(entry);
      } else {
        preview.textContent = `错误：${data.error}`;
      }
    } catch (e) {
      preview.textContent = `错误：${e.message}`;
    }
  });
}

function confirmDeleteLink(entry, index, bar, wrapEl) {
  // Prevent double-confirm
  if (wrapEl.querySelector('.link-confirm-row')) return;
  const delBtn = wrapEl.querySelector('button');
  delBtn.style.display = 'none';

  const confirmRow = document.createElement('span');
  confirmRow.className = 'link-confirm-row';
  confirmRow.style.cssText = 'display:inline-flex;align-items:center;gap:4px;';

  const okBtn = document.createElement('button');
  okBtn.className = 'md-header-btn primary';
  okBtn.style.cssText = 'font-size:10px;padding:1px 6px;';
  okBtn.textContent = '确认删除';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'md-header-btn';
  cancelBtn.style.cssText = 'font-size:10px;padding:1px 6px;';
  cancelBtn.textContent = '取消';

  cancelBtn.addEventListener('click', () => {
    confirmRow.remove();
    delBtn.style.display = '';
  });

  okBtn.addEventListener('click', async () => {
    const newLinks = (entry.links || []).filter((_, i) => i !== index);
    try {
      const res = await fetch('/api/update-links', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: getEntryId(entry), links: newLinks })
      });
      const data = await res.json();
      if (data.ok) {
        entry.links = newLinks;
        updateCardLinksBadge(entry);
        renderLinksBar(entry);
      } else {
        cancelBtn.click();
      }
    } catch { cancelBtn.click(); }
  });

  confirmRow.append(okBtn, cancelBtn);
  wrapEl.appendChild(confirmRow);
}

function updateCardLinksBadge(entry) {
  const id = getEntryId(entry);
  if (!id) return;
  const card = document.querySelector(`.doc-card[data-id="${id}"]`);
  if (!card) return;
  const badges = card.querySelector('.badges');
  if (!badges) return;
  let badge = badges.querySelector('.badge-links');
  const count = entry.links && entry.links.length;
  if (count) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'badge badge-links';
      badges.appendChild(badge);
    }
    badge.title = `${count} 个关联链接`;
    badge.textContent = `👍 ×${count}`;
  } else {
    if (badge) badge.remove();
  }
}

async function toggleDone(entry, card) {
  const newDone = !entry.done;
  try {
    const res = await fetch('/api/set-done', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: getEntryId(entry), done: newDone })
    });
    const data = await res.json();
    if (!data.ok) return;
    entry.done = newDone || undefined;
    // Update card visual
    card.classList.toggle('done', !!newDone);
    const btn = card.querySelector('[data-action="toggle-done"]');
    if (btn) {
      btn.textContent = newDone ? '✓ 已处理' : '○ 处理';
      btn.title = newDone ? '标记为未处理' : '标记为已处理';
    }
  } catch (e) {
    console.error('toggleDone failed', e);
  }
}

function getEntryId(entry) {
  if (entry._id) return entry._id;
  // Fallback: search indexData by common_path
  for (const [id, e] of Object.entries(indexData)) {
    if (e.common_path === entry.common_path) return id;
  }
  return null;
}

document.getElementById('btn-edit').addEventListener('click', enterEditMode);
document.getElementById('btn-save').addEventListener('click', saveDoc);
document.getElementById('btn-cancel-edit').addEventListener('click', () => exitEditMode(false));

// ── Commit bar (single file) ───────────────────────────────────────────────

function showCommitBar() {
  document.getElementById('md-commit-msg').value = '';
  document.getElementById('md-commit-result').textContent = '';
  document.getElementById('btn-panel-commit').style.display = 'none';
  document.getElementById('md-commit-bar').style.display = 'flex';
  document.getElementById('md-commit-msg').focus();
}

function hideCommitBar() {
  document.getElementById('md-commit-bar').style.display = 'none';
}

async function commitCurrentFile() {
  if (!currentEntry) return;
  const msg = document.getElementById('md-commit-msg').value.trim() || 'update: edit via viewer';
  const resultEl = document.getElementById('md-commit-result');
  const btn = document.getElementById('btn-commit-file');
  btn.disabled = true;
  btn.textContent = '提交中…';
  resultEl.style.color = '#57606a';
  resultEl.textContent = '';

  try {
    const filePath = `${currentLayer}/${currentEntry.common_path}`;
    const res = await fetch('/api/commit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, files: [filePath] })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error + (data.stderr ? '\n' + data.stderr : ''));

    resultEl.style.color = '#1a7f37';
    resultEl.textContent = '✓ 已推送！';
    await loadDiffStatus();
    updateDiffInDOM();
    await loadIndex();
    setTimeout(hideCommitBar, 1500);
  } catch (e) {
    resultEl.style.color = '#cf222e';
    resultEl.textContent = `✗ ${e.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = '↑ 提交';
  }
}

document.getElementById('btn-panel-commit').addEventListener('click', showCommitBar);
document.getElementById('btn-commit-file').addEventListener('click', commitCurrentFile);
document.getElementById('btn-skip-commit').addEventListener('click', hideCommitBar);
document.getElementById('md-commit-msg').addEventListener('keydown', e => {
  if (e.key === 'Enter') commitCurrentFile();
});

// ── Close viewer ───────────────────────────────────────────────────────────

function closeModal() {
  document.getElementById('md-modal').style.display = 'none';
  document.body.style.overflow = '';
  exitEditMode(false);
  hideCommitBar();
}

document.getElementById('md-close').addEventListener('click', closeModal);
document.getElementById('md-backdrop').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Pull project ───────────────────────────────────────────────────────────

async function pullProject() {
  const btn = document.getElementById('btn-pull');
  btn.disabled = true;
  btn.textContent = '更新中…';
  try {
    const res = await fetch('/api/pull', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error((data.error || '') + (data.stderr ? '\n' + data.stderr : ''));

    titleCache.clear();
    if (indexData) {
      for (const entry of Object.values(indexData)) {
        LAYERS.forEach(l => delete entry[`_unreachable_${l}`]);
      }
    }
    await loadIndex();
  } catch (e) {
    alert(`更新失败：${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = '↓ 更新项目';
  }
}

document.getElementById('btn-pull').addEventListener('click', pullProject);

async function pushIndex() {
  const btn = document.getElementById('btn-push-index');
  btn.disabled = true;
  btn.textContent = 'Push中…';
  try {
    const res = await fetch('/api/commit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'chore: update index.json', files: ['index.json'] })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'failed');
    btn.textContent = '✓ 已 Push';
    setTimeout(() => { btn.textContent = '↑ Push index'; }, 2000);
  } catch (e) {
    alert(`Push 失败：${e.message}`);
  } finally {
    btn.disabled = false;
    if (btn.textContent === 'Push中…') btn.textContent = '↑ Push index';
  }
}

document.getElementById('btn-push-index').addEventListener('click', pushIndex);

  try {
    const entryId = getEntryId(currentEntry);
    const res = await fetch('/api/delete', {
      method: 'POST',

// ── Fast tooltip shim ─────────────────────────────────────────────────────
(function() {
  const box = document.createElement('div');
  box.id = '_tip';
  document.body.appendChild(box);
  let timer = null;

  function show(el, x, y) {
    const text = el.dataset.tip;
    if (!text) return;
    box.textContent = text;
    // Measure size before showing: temporarily make visible but still transparent
    const gap = 8;
    let top = y + gap;
    let left = x + gap;
    box.classList.remove('visible');
    box.style.display = 'block';
    const bw = box.offsetWidth, bh = box.offsetHeight;
    if (top + bh > window.innerHeight - 4) top = y - bh - gap;
    if (left + bw > window.innerWidth - 4) left = window.innerWidth - bw - 4;
    box.style.left = left + 'px';
    box.style.top = top + 'px';
    box.classList.add('visible');
  }

  function hide() {
    clearTimeout(timer);
    box.classList.remove('visible');
  }

  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) { hide(); return; }
    if (!el.dataset.tip) { hide(); return; }
    clearTimeout(timer);
    timer = setTimeout(() => show(el, e.clientX, e.clientY), 150);
  }, true);

  document.addEventListener('mousemove', e => {
    if (!box.classList.contains('visible')) return;
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    let top = e.clientY + 8, left = e.clientX + 8;
    const bw = box.offsetWidth, bh = box.offsetHeight;
    if (top + bh > window.innerHeight - 4) top = e.clientY - bh - 8;
    if (left + bw > window.innerWidth - 4) left = window.innerWidth - bw - 4;
    box.style.left = left + 'px';
    box.style.top = top + 'px';
  }, true);

  document.addEventListener('mouseout', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    if (el.contains(e.relatedTarget)) return;
    clearTimeout(timer);
    hide();
  }, true);
})();
