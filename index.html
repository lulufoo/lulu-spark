<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dialogue Insight Archive</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <h1>Dialogue Insight Archive</h1>
  <a href="https://github.com/lulufoo/cognitive-trace-archive" target="_blank">GitHub ↗</a>
  <button id="btn-refresh">⟳ 刷新</button>
  <button id="btn-pull">↓ 更新项目</button>
  <button id="btn-push-index">↑ 提交变更</button>
  <button id="btn-move-doc-header">→ 移动</button>
</header>

<div class="layout">
  <aside id="sidebar">
    <div style="padding:12px 16px;font-size:11px;color:#8c959f;">加载中…</div>
  </aside>
  <main id="main">
    <div id="status"><div style="color:#8c959f;font-size:13px;">← 选择日期查看文档</div></div>
    <div id="date-heading" style="display:none"></div>
    <div id="doc-list" class="doc-list"></div>
  </main>
</div>

<!-- MD Viewer -->
<div id="md-modal" style="display:none">
  <div id="md-backdrop"></div>
  <div id="md-panel">
    <div id="md-header">
      <span id="md-panel-title"></span>
      <span id="md-file-size" style="font-size:10px;color:#8c959f;flex-shrink:0;"></span>
      <a id="md-github-link" href="#" target="_blank" style="font-size:12px;color:#0969da;text-decoration:none;flex-shrink:0;">GitHub ↗</a>
      <button class="md-header-btn" id="btn-copy-http" data-tip="">&#127760;</button>
      <button class="md-header-btn" id="btn-copy-path" data-tip="">&#128194;</button>
      <button class="md-header-btn" id="btn-edit">✏️ 编辑</button>
      <button class="md-header-btn" id="btn-add-comment">💬 笔记</button>
      <button class="md-header-btn primary" id="btn-save" style="display:none">💾 保存</button>
      <button class="md-header-btn" id="btn-cancel-edit" style="display:none">取消</button>
      <button class="md-header-btn" id="btn-panel-commit" style="display:none">● 提交此文件</button>
      <button id="md-close" class="md-header-btn">✕ 关闭</button>
    </div>
    <div id="md-commit-bar">
      <span style="font-size:12px;color:#7d4e00;flex-shrink:0;">● 待提交：</span>
      <input id="md-commit-msg" type="text" placeholder="update: edit via viewer" />
      <button id="btn-commit-file" class="md-header-btn primary" style="font-size:11px;padding:3px 10px;">↑ 提交</button>
      <button id="btn-skip-commit" class="md-header-btn" style="font-size:11px;padding:3px 10px;">稍后</button>
      <span id="md-commit-result" style="font-size:11px;"></span>
    </div>
    <div id="md-links-bar" style="display:none;padding:8px 20px;border-bottom:1px solid #d0d7de;display:flex;align-items:center;flex-wrap:wrap;gap:4px 0;"></div>
    <div id="md-body"></div>
    <textarea id="md-edit-area" style="display:none" spellcheck="false"></textarea>
  </div>
</div>

<!-- Comment dialog -->
<div id="comment-dialog">
  <div id="comment-dialog-box">
    <h3 id="comment-dialog-title">💬 添加笔记</h3>
    <div id="comment-editor-box" class="comment-editor-box" onclick="document.getElementById('comment-dialog-content').focus()">
      <div id="comment-dialog-content" class="comment-editor-content" contenteditable="true" data-placeholder="输入笔记内容…（Ctrl/Cmd+Enter 保存）"></div>
    </div>
    <div id="comment-dialog-actions">
      <button id="btn-comment-cancel" class="md-header-btn">取消</button>
      <button id="btn-comment-save" class="md-header-btn primary">保存</button>
    </div>
  </div>
</div>

<!-- Commit changes dialog -->
<div id="commit-changes-dialog">
  <div id="commit-changes-dialog-box">
    <h3>↑ 提交变更</h3>
    <div id="commit-changes-file-list"></div>
    <input id="commit-changes-msg" type="text" placeholder="提交信息（留空：chore: update via viewer）" autocomplete="off" />
    <div id="commit-changes-dialog-actions">
      <span id="commit-changes-result"></span>
      <button id="btn-commit-changes-cancel">取消</button>
      <button id="btn-commit-changes-ok">提交</button>
    </div>
  </div>
</div>

<!-- Move doc dialog -->
<div id="move-doc-dialog">
  <div id="move-doc-dialog-box">
    <h3>→ 移动 GitHub 文档</h3>
    <div class="move-doc-field">
      <label>源文件 URL（GitHub blob 链接）</label>
      <input id="move-src-url" type="text" placeholder="https://github.com/owner/repo/blob/main/dir/file.md" autocomplete="off" spellcheck="false" />
    </div>
    <div class="move-doc-field">
      <label>目标目录 URL（GitHub 目录链接）</label>
      <input id="move-dst-url" type="text" placeholder="https://github.com/owner/repo/subdir" autocomplete="off" spellcheck="false" />
    </div>
    <div id="move-doc-result"></div>
    <div id="move-doc-dialog-actions">
      <button id="btn-move-doc-cancel" class="md-header-btn">取消</button>
      <button id="btn-move-doc-ok" class="md-header-btn primary">确认移动</button>
    </div>
  </div>
</div>

<!-- Delete confirm dialog -->
<div id="delete-dialog">
  <div id="delete-dialog-box">
    <h3>⚠️ 删除文档</h3>
    <p id="delete-dialog-desc">将删除此条目的所有关联文件（raw / distilled / trace / digest）并从 index.json 移除，<strong>不可撤销</strong>。</p>
    <div id="delete-dialog-confirm-row">
      输入 <code>CONFIRM</code> 确认删除
      <button id="btn-copy-confirm-word" title="复制 CONFIRM">复制</button>
    </div>
    <input id="delete-confirm-input" type="text" placeholder="在此输入 CONFIRM" autocomplete="off" />
    <div id="delete-dialog-actions">
      <button id="btn-delete-cancel">取消</button>
      <button id="btn-delete-confirm-ok" disabled>确认删除</button>
    </div>
  </div>
</div>

<script type="module">
import { state } from './js/state.js'
import { escHtml, slugToTitle, filenameFromPath, topicFromPath, formatDate, timeFromTs, nowTs, importanceBadgeHtml } from './js/utils.js'
import { REPO, LAYERS, IMPORTANCE_CYCLE } from './js/constants.js'
import * as api from './js/api.js'
import { buildGroups, renderSidebar, selectDate } from './js/components/sidebar.js'
import { getEntryDiffState, getLayerBadgeClass, attachBadgeListeners, buildCard, renderDocList, updateDiffInDOM } from './js/components/cards.js'
// Cache: date string -> Map<id, title>  (alias to state.index.titleCache)
const titleCache = state.index.titleCache;

// Diff status: filepath → 'modified' | 'conflict'  (alias to state.index.diffStatus)
const diffStatus = state.index.diffStatus;

let indexData = null;    // full entries object
let groupedByDate = [];  // [{date, entries:[{id, entry}]}] sorted desc
let archiveRoot = '';    // loaded from /api/config

// ── Diff helpers ───────────────────────────────────────────────────────────────────

async function loadDiffStatus() {
  try {
    const data = await api.fetchDiffStatus();
    if (!data) return;
    diffStatus.clear();
    for (const p of (data.modified || [])) diffStatus.set(p, 'modified');
    for (const p of (data.conflicted || [])) diffStatus.set(p, 'conflict');
  } catch { /* non-critical, server may not support */ }
}


// ── Fetch index.json ───────────────────────────────────────────────────────

async function loadIndex() {
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true;
  btn.textContent = '⟳ 加载中…';

  try {
    const data = await api.fetchIndex();
    state.index.data = data.entries || data;  // support both {entries:{}} and flat {}
    state.index.groupedByDate = buildGroups(state.index.data);
    indexData = state.index.data;
    groupedByDate = state.index.groupedByDate;
    renderSidebar();
    await Promise.all([loadDiffStatus(), loadAnnotationsSummary()]);
    const savedDate = sessionStorage.getItem('cta_active_date');
    const targetDate = (savedDate && groupedByDate.find(g => g.date === savedDate))
      ? savedDate
      : (groupedByDate.length > 0 ? groupedByDate[0].date : null);
    if (targetDate) selectDate(targetDate);
  } catch (e) {
    showError(`无法加载 index.json：${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = '⟳ 刷新';
  }
}

async function loadAnnotationsSummary() {
  try {
    const summary = await api.fetchAnnotationsSummary();
    if (!summary) return;
    annotationsSummary = summary;
    // Merge summary into entry objects so buildCard can read done/links as before
    for (const entry of Object.values(indexData)) {
      const ann = annotationsSummary[entry.common_path];
      if (ann) {
        entry.done = ann.done || undefined;
        entry.importance = ann.importance || undefined;
        entry.links = ann.links || undefined;
        entry._comment_counts = ann.comment_counts || undefined;
      } else {
        delete entry.done;
        delete entry.importance;
        delete entry.links;
        delete entry._comment_counts;
      }
    }
  } catch {
    // Non-fatal: annotations are optional
  }
}


// ── Sidebar ────────────────────────────────────────────────────────────────

// ── Select date ────────────────────────────────────────────────────────────


// ── Title loading ──────────────────────────────────────────────────────────

async function loadTitles(entries, date) {
  if (titleCache.has(date)) {
    updateTitlesInDOM(date);
    return;
  }

  titleCache.set(date, new Map());

  await Promise.all(entries.map(async ({ id, entry }) => {
    if (!entry.layers?.includes('raw')) {
      // No raw file: fallback to slug
      const title = slugToTitle(filenameFromPath(entry.common_path));
      titleCache.get(date).set(id, title);
      return;
    }

    try {
      const text = await api.fetchFileContent('raw', entry.common_path);
      const h1Match = text.match(/^#\s+(.+)/m);
      const title = h1Match ? h1Match[1].trim() : slugToTitle(filenameFromPath(entry.common_path));
      titleCache.get(date).set(id, title);
    } catch {
      // Mark raw as unreachable in a non-destructive way
      entry._unreachable_raw = true;
      titleCache.get(date).set(id, slugToTitle(filenameFromPath(entry.common_path)));
    }
  }));

  // Only update DOM if this date is still active
  if (state.ui.activeDate === date) updateTitlesInDOM(date);
}

function updateTitlesInDOM(date) {
  const cache = titleCache.get(date);
  if (!cache) return;
  const group = groupedByDate.find(g => g.date === date);
  if (!group) return;

  for (const { id, entry } of group.entries) {
    const card = document.querySelector(`.doc-card[data-id="${id}"]`);
    if (!card) continue;

    const titleEl = card.querySelector('.doc-title-btn');
    if (titleEl) {
      titleEl.classList.remove('loading');
      titleEl.textContent = cache.get(id) || slugToTitle(filenameFromPath(entry.common_path));
    }

    // Re-render badges if unreachable state changed
    const badgesEl = card.querySelector('.badges');
    if (badgesEl) {
      const layerHtml = LAYERS
        .filter(layer => entry.layers?.includes(layer))
        .map(layer => {
          const cc = entry._comment_counts?.[layer];
          const ccStr = cc ? `<span class="badge-comment-dot">${cc}</span>` : '';
          if (entry[`_unreachable_${layer}`]) {
            return `<span class="badge badge-unreachable" title="文件不可达">${layer}${ccStr}</span>`;
          }
          return `<button class="badge ${getLayerBadgeClass(layer, entry)}" data-layer="${layer}">${layer}${ccStr}</button>`;
        })
        .join('');
      const linkCount = entry.links && entry.links.length;
      const linksBadgeHtml = linkCount
        ? `<span class="badge badge-links" title="${linkCount} 个关联链接">👍 ×${linkCount}</span>`
        : '';
      const doneBadgeHtml = entry.done
        ? `<button class="badge badge-done" data-action="toggle-done" title="标记为未处理">✓ 已处理</button>`
        : `<button class="badge badge-done" data-action="toggle-done" title="标记为已处理">○ 处理</button>`;
      badgesEl.innerHTML = layerHtml + linksBadgeHtml + importanceBadgeHtml(entry.importance) + doneBadgeHtml;
      attachBadgeListeners(card, entry);
      card.classList.toggle('done', !!entry.done);
      card.classList.remove('importance-high', 'importance-medium', 'importance-low');
      if (entry.importance) card.classList.add(`importance-${entry.importance}`);
      card.querySelector('[data-action="toggle-done"]').addEventListener('click', () => toggleDone(entry, card));
      card.querySelector('[data-action="cycle-importance"]').addEventListener('click', () => cycleImportance(entry, card));
    }
  }
}

// ── Error display ──────────────────────────────────────────────────────────

function showError(msg) {
  const status = document.getElementById('status');
  status.style.display = '';
  const errDiv = document.createElement('div');
  errDiv.className = 'error-msg';
  errDiv.innerHTML = escHtml(msg) + '<br>';
  const retryBtn = document.createElement('button');
  retryBtn.textContent = '重试';
  retryBtn.addEventListener('click', loadIndex);
  errDiv.appendChild(retryBtn);
  status.innerHTML = '';
  status.appendChild(errDiv);
  document.getElementById('date-heading').style.display = 'none';
  document.getElementById('doc-list').innerHTML = '';
}

// ── Refresh ────────────────────────────────────────────────────────────────

document.getElementById('btn-refresh').addEventListener('click', () => {
  titleCache.clear();
  // Reset unreachable flags
  if (indexData) {
    for (const entry of Object.values(indexData)) {
      LAYERS.forEach(l => delete entry[`_unreachable_${l}`]);
    }
  }
  loadIndex();
});

// Save doc-list scroll position per active date
document.getElementById('doc-list').addEventListener('scroll', () => {
  if (state.ui.activeDate) {
    sessionStorage.setItem('cta_scroll_' + state.ui.activeDate, document.getElementById('doc-list').scrollTop);
  }
}, { passive: true });

// ── MD Viewer ─────────────────────────────────────────────────────────────

function resolveRelativeLink(href, currentLayer, commonPath) {
  // Resolve relative MD links to absolute GitHub blob URLs
  try {
    const base = `http://x/${currentLayer}/${commonPath}`;
    const resolved = new URL(href, base);
    const repoPath = resolved.pathname.slice(1); // strip leading /
    return `${REPO}/${repoPath}`;
  } catch {
    return null;
  }
}

function postProcessLinks(container, currentLayer, commonPath) {
  container.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (!href || href.startsWith('#')) return;
    if (href.startsWith('http://') || href.startsWith('https://')) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      return;
    }
    // Relative link → resolve to GitHub blob URL
    const ghUrl = resolveRelativeLink(href, currentLayer, commonPath);
    if (ghUrl) {
      a.href = ghUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
  });
}

// ── Current viewer state ───────────────────────────────────────────────────

let currentEntry = null;
let currentLayer = 'raw';
let currentRawText = '';
let currentAnnotation = {};     // full annotation for currently open doc
let annotationsSummary = {};    // { common_path: summary } batch from /api/annotations

// ── Open doc ───────────────────────────────────────────────────────────────

async function openDoc(entry, layer = 'raw') {
  currentEntry = entry;
  currentLayer = layer;
  currentAnnotation = {};
  exitEditMode(false);
  hideCommitBar();

  const modal = document.getElementById('md-modal');
  const body = document.getElementById('md-body');
  document.getElementById('md-panel-title').textContent = filenameFromPath(entry.common_path).replace(/\.md$/, '');
  const githubUrl = `${REPO}/${layer}/${entry.common_path}`;
  document.getElementById('md-github-link').href = githubUrl;
  document.getElementById('btn-copy-http').dataset.url = githubUrl;
  document.getElementById('btn-copy-http').dataset.tip = githubUrl;
  const relPath = `${layer}/${entry.common_path}`;
  const fullPath = archiveRoot ? `${archiveRoot}/${relPath}` : relPath;
  document.getElementById('btn-copy-path').dataset.tip = fullPath;
  document.getElementById('md-file-size').textContent = '';
  body.innerHTML = '<div style="color:#8c959f;padding:20px;font-size:13px;">加载中…</div>';
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  const [mdResult, annResult] = await Promise.allSettled([
    fetch(`./${layer}/${entry.common_path}?t=${Date.now()}`)
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.text(); }),
    fetch(`/api/annotation?path=${encodeURIComponent(entry.common_path)}`)
      .then(r => r.json()).catch(() => ({}))
  ]);

  if (annResult.status === 'fulfilled') currentAnnotation = annResult.value || {};

  if (mdResult.status === 'rejected') {
    body.innerHTML = `<div style="color:#7d4e00;padding:20px">无法加载文件：${escHtml(mdResult.reason.message)}</div>`;
    document.getElementById('btn-edit').style.display = 'none';
    return;
  }

  const text = mdResult.value;
  currentRawText = text;
  const bytes = new Blob([text]).size;
  document.getElementById('md-file-size').textContent = bytes < 1024
    ? `${bytes} B`
    : bytes < 1024 * 1024
      ? `${(bytes / 1024).toFixed(1)} KB`
      : `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  renderDocBody(text, layer, entry.common_path);
  const hasDiff = diffStatus.get(`${layer}/${entry.common_path}`);
  document.getElementById('btn-panel-commit').style.display = hasDiff ? '' : 'none';
}

function renderDocBody(text, layer, commonPath) {
  const body = document.getElementById('md-body');
  if (typeof marked !== 'undefined') {
    body.innerHTML = marked.parse(text);
  } else {
    body.innerHTML = `<pre style="white-space:pre-wrap;font-size:13px">${escHtml(text)}</pre>`;
  }
  postProcessLinks(body, layer, commonPath);
  document.getElementById('btn-edit').style.display = '';
  renderLinksBar(currentEntry);
  renderComments(currentAnnotation, layer, currentEntry);
  // Append delete button at end of content
  const zone = document.createElement('div');
  zone.className = 'md-body-delete-zone';
  const delBtn = document.createElement('button');
  delBtn.id = 'btn-delete';
  delBtn.textContent = '🗑 删除此条目';
  delBtn.title = '删除此条目的所有关联文件（raw / distilled / trace / digest / diagnose）';
  delBtn.addEventListener('click', openDeleteDialog);
  zone.appendChild(delBtn);
  body.appendChild(zone);
}

// ── Edit mode ──────────────────────────────────────────────────────────────

function enterEditMode() {
  const editArea = document.getElementById('md-edit-area');
  const body = document.getElementById('md-body');
  editArea.value = currentRawText;
  body.style.display = 'none';
  editArea.style.display = '';
  requestAnimationFrame(() => { editArea.scrollTop = 0; });
  editArea.focus();
  document.getElementById('btn-edit').style.display = 'none';
  document.getElementById('btn-add-comment').style.display = 'none';
  document.getElementById('btn-panel-commit').style.display = 'none';
  document.getElementById('btn-save').style.display = '';
  document.getElementById('btn-cancel-edit').style.display = '';
  document.getElementById('md-github-link').style.display = 'none';
  hideCommitBar();
}

function exitEditMode(rerender = true) {
  const editArea = document.getElementById('md-edit-area');
  const body = document.getElementById('md-body');
  editArea.style.display = 'none';
  body.style.display = '';
  document.getElementById('btn-edit').style.display = '';
  document.getElementById('btn-add-comment').style.display = '';
  document.getElementById('btn-save').style.display = 'none';
  document.getElementById('btn-cancel-edit').style.display = 'none';
  document.getElementById('btn-panel-commit').style.display = 'none';
  document.getElementById('md-github-link').style.display = '';
  if (rerender && currentEntry) {
    renderDocBody(currentRawText, currentLayer, currentEntry.common_path);
  }
}

async function saveDoc() {
  if (!currentEntry) return;
  const editArea = document.getElementById('md-edit-area');
  const newContent = editArea.value;
  const btnSave = document.getElementById('btn-save');
  btnSave.disabled = true;
  btnSave.textContent = '保存中…';

  try {
    const data = await api.saveFile(currentLayer, currentEntry.common_path, newContent);
    if (data.error) throw new Error(data.error);

    currentRawText = newContent;
    const date = currentEntry.created_at.slice(0, 8);
    // Update title cache from new content's H1
    const h1Match = newContent.match(/^#\s+(.+)/m);
    const newTitle = h1Match ? h1Match[1].trim() : slugToTitle(filenameFromPath(currentEntry.common_path));
    const entryId = getEntryId(currentEntry);
    if (!titleCache.has(date)) titleCache.set(date, new Map());
    titleCache.get(date).set(entryId, newTitle);
    const card = entryId ? document.querySelector(`.doc-card[data-id="${entryId}"]`) : null;
    if (card) {
      const titleEl = card.querySelector('.doc-title-btn');
      if (titleEl) { titleEl.classList.remove('loading'); titleEl.textContent = newTitle; }
    } else {
      updateTitlesInDOM(date);
    }
    exitEditMode(true);
    await loadDiffStatus();
    updateDiffInDOM();
    showCommitBar();
  } catch (e) {
    alert(`保存失败：${e.message}\n\n请确认已通过 python3 server.py 启动服务器。`);
  } finally {
    btnSave.disabled = false;
    btnSave.textContent = '💾 保存';
  }
}

document.getElementById('btn-copy-http').addEventListener('click', () => {
  const url = document.getElementById('btn-copy-http').dataset.url || '';
  if (!url) return;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('btn-copy-http');
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = '🌐'; }, 1200);
  });
});

document.getElementById('btn-copy-path').addEventListener('click', () => {
  const relPath = `${currentLayer}/${currentEntry.common_path}`;
  const fullPath = archiveRoot ? `${archiveRoot}/${relPath}` : relPath;
  navigator.clipboard.writeText(fullPath).then(() => {
    const btn = document.getElementById('btn-copy-path');
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = '📂'; }, 1200);
  });
});

// ── Comments ──────────────────────────────────────────────────────────────

// Render comment list at the TOP of md-body (before document content)
function renderComments(annotation, layer, entry) {
  const existing = document.getElementById('md-comments-bar');
  if (existing) existing.remove();
  if (!entry) return;

  const layerData = (annotation && annotation[layer]) || {};
  const comments = layerData.comments || [];
  if (comments.length === 0) return;

  const body = document.getElementById('md-body');
  const bar = document.createElement('div');
  bar.id = 'md-comments-bar';

  const hdr = document.createElement('div');
  hdr.className = 'comment-bar-header';
  hdr.innerHTML = `<span>💬 笔记 · ${comments.length} 条</span>`;
  bar.appendChild(hdr);

  for (let i = 0; i < comments.length; i++) {
    bar.appendChild(buildCommentItem(comments[i], layer, entry, i + 1));
  }

  body.insertBefore(bar, body.firstChild);
}

function buildCommentItem(c, layer, entry, noteIndex) {
  const item = document.createElement('div');
  item.className = 'comment-item';
  item.dataset.cid = c.id;

  const prefixEl = document.createElement('span');
  prefixEl.className = 'comment-item-prefix';
  prefixEl.textContent = `NOTE ${noteIndex}:`;

  const textEl = document.createElement('div');
  textEl.className = 'comment-item-text';
  if (typeof marked !== 'undefined') {
    textEl.innerHTML = marked.parse(c.text);
  } else {
    textEl.textContent = c.text;
  }

  const tsEl = document.createElement('span');
  tsEl.className = 'comment-item-ts';
  if (c.ts && c.ts.length >= 12) {
    tsEl.textContent = `${c.ts.slice(0,4)}-${c.ts.slice(4,6)}-${c.ts.slice(6,8)} ${c.ts.slice(8,10)}:${c.ts.slice(10,12)}`;
  }

  // 右上角 ×
  const delX = document.createElement('button');
  delX.className = 'comment-item-del-x';
  delX.title = '删除';
  delX.textContent = '×';
  delX.addEventListener('click', async () => {
    if (!confirm('删除此笔记？')) return;
    try {
      const data = await api.updateComments(entry.common_path, layer, { id: c.id, text: '' }, nowTs());
      if (data.ok) {
        const ld = currentAnnotation[layer] || {};
        ld.comments = (ld.comments || []).filter(x => x.id !== c.id);
        if (!ld.comments.length) delete currentAnnotation[layer];
        else currentAnnotation[layer] = ld;
        renderComments(currentAnnotation, layer, entry);
      }
    } catch (e) { alert(`删除失败：${e.message}`); }
  });

  // 右下角编辑
  const editBtn = document.createElement('button');
  editBtn.className = 'comment-item-edit';
  editBtn.textContent = '编辑';
  editBtn.addEventListener('click', () => openCommentDialog(c, layer, entry, noteIndex));

  item.append(delX, prefixEl, textEl, tsEl, editBtn);
  return item;
}

// State: null = add mode; object = edit mode { c, layer, entry }
let _commentEditCtx = null;

function openCommentDialog(editComment, layer, entry, noteIndex) {
  if (!currentEntry && !entry) return;
  const titleEl = document.getElementById('comment-dialog-title');
  const content = document.getElementById('comment-dialog-content');
  if (editComment) {
    _commentEditCtx = { c: editComment, layer, entry, noteIndex };
    titleEl.textContent = '💬 编辑笔记';
    content.innerText = editComment.text;
  } else {
    _commentEditCtx = { noteIndex };
    titleEl.textContent = '💬 添加笔记';
    content.innerText = '';
  }
  document.getElementById('comment-dialog').classList.add('open');
  requestAnimationFrame(() => {
    content.focus();
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(content);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  });
}

function closeCommentDialog() {
  document.getElementById('comment-dialog').classList.remove('open');
  _commentEditCtx = null;
}

async function saveComment() {
  if (!_commentEditCtx) return;
  const content = document.getElementById('comment-dialog-content');
  const text = content.innerText.trim();
  if (!text) return;
  const saveBtn = document.getElementById('btn-comment-save');
  saveBtn.disabled = true;
  saveBtn.textContent = '保存中…';
  const ts = nowTs();
  try {
    if (_commentEditCtx.c) {
      // 编辑模式
      const { c, layer, entry } = _commentEditCtx;
      if (text === c.text) { closeCommentDialog(); return; }
      const data = await api.updateComments(entry.common_path, layer, { id: c.id, text }, ts);
      if (data.ok) {
        c.text = text;
        const ld = currentAnnotation[layer] || {};
        const idx = (ld.comments || []).findIndex(x => x.id === c.id);
        if (idx >= 0) ld.comments[idx].text = text;
        closeCommentDialog();
        renderComments(currentAnnotation, layer, entry);
      } else { alert(`保存失败：${data.error}`); }
    } else {
      // 新增模式
      if (!currentEntry) return;
      const data = await api.updateComments(currentEntry.common_path, currentLayer, { text }, ts);
      if (data.ok) {
        if (!currentAnnotation[currentLayer]) currentAnnotation[currentLayer] = {};
        if (!currentAnnotation[currentLayer].comments) currentAnnotation[currentLayer].comments = [];
        currentAnnotation[currentLayer].comments.push({ id: data.id, text, ts });
        closeCommentDialog();
        renderComments(currentAnnotation, currentLayer, currentEntry);
      } else { alert(`添加失败：${data.error}`); }
    }
  } catch (e) { alert(`保存失败：${e.message}`); }
  finally { saveBtn.disabled = false; saveBtn.textContent = '保存'; }
}

document.getElementById('btn-add-comment').addEventListener('click', () => {
  const layerData = (currentAnnotation && currentAnnotation[currentLayer]) || {};
  const nextIdx = (layerData.comments || []).length + 1;
  openCommentDialog(null, null, null, nextIdx);
});
document.getElementById('btn-comment-cancel').addEventListener('click', closeCommentDialog);
document.getElementById('btn-comment-save').addEventListener('click', saveComment);
document.getElementById('comment-dialog-content').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveComment(); }
  if (e.key === 'Escape') closeCommentDialog();
});

  if (e.target === document.getElementById('comment-dialog')) closeCommentDialog();
});

const titleFetchCache = state.index.titleFetchCache;

async function fetchTitle(url) {
  if (titleFetchCache.has(url)) return titleFetchCache.get(url);
  try {
    const data = await api.fetchLinkTitle(url);
    const title = data.title || fallbackTitle(url);
    titleFetchCache.set(url, title);
    return title;
  } catch {
    return fallbackTitle(url);
  }
}

function fallbackTitle(url) {
  try {
    return decodeURIComponent(new URL(url).pathname.split('/').filter(Boolean).pop()).replace(/\.md$/, '');
  } catch { return url; }
}

function renderLinksBar(entry) {
  const bar = document.getElementById('md-links-bar');
  bar.innerHTML = '';
  const links = entry && entry.links;

  // Add-link button
  const addBtn = document.createElement('button');
  addBtn.className = 'md-header-btn';
  addBtn.style.cssText = 'font-size:11px;padding:2px 8px;margin-left:auto;flex-shrink:0;';
  addBtn.textContent = '＋ 添加链接';
  addBtn.addEventListener('click', () => showAddLinkInput(entry, bar));

  if (!links || links.length === 0) {
    bar.style.display = 'flex';
    bar.appendChild(addBtn);
    return;
  }

  bar.style.display = 'flex';
  for (let i = 0; i < links.length; i++) {
    const link = links[i];
    const wrap = document.createElement('span');
    wrap.style.cssText = 'display:inline-flex;align-items:center;gap:4px;margin-right:12px;flex-shrink:0;';

    const a = document.createElement('a');
    a.href = link.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.cssText = 'font-size:12px;color:#0969da;text-decoration:none;';
    a.textContent = '🔗 加载中…';
    fetchTitle(link.url).then(t => { a.textContent = `🔗 ${t} ↗`; });

    const delBtn = document.createElement('button');
    delBtn.style.cssText = 'font-size:10px;line-height:1;padding:1px 4px;border:1px solid #d0d7de;border-radius:3px;background:#fff;color:#8c959f;cursor:pointer;opacity:0.6;';
    delBtn.textContent = '×';
    delBtn.title = '删除此链接';
    delBtn.addEventListener('click', () => confirmDeleteLink(entry, i, bar, wrap));

    wrap.append(a, delBtn);
    bar.appendChild(wrap);
  }
  bar.appendChild(addBtn);
}

function showAddLinkInput(entry, bar) {
  // Prevent duplicate input
  if (bar.querySelector('.links-input-row')) return;
  const row = document.createElement('div');
  row.className = 'links-input-row';
  row.style.cssText = 'display:flex;align-items:center;gap:6px;margin-top:4px;width:100%;';

  const input = document.createElement('input');
  input.type = 'url';
  input.placeholder = '粘贴 GitHub 链接…';
  input.style.cssText = 'flex:1;font-size:12px;padding:3px 8px;border:1px solid #d0d7de;border-radius:4px;';

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'md-header-btn primary';
  confirmBtn.style.cssText = 'font-size:11px;padding:2px 8px;';
  confirmBtn.textContent = '确认';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'md-header-btn';
  cancelBtn.style.cssText = 'font-size:11px;padding:2px 8px;';
  cancelBtn.textContent = '取消';

  const preview = document.createElement('span');
  preview.style.cssText = 'font-size:11px;color:#57606a;';

  row.append(input, confirmBtn, cancelBtn, preview);
  bar.appendChild(row);
  input.focus();

  let resolvedTitle = '';
  let fetchTimer = null;
  input.addEventListener('input', () => {
    clearTimeout(fetchTimer);
    preview.textContent = '';
    resolvedTitle = '';
    const url = input.value.trim();
    if (!url) return;
    fetchTimer = setTimeout(async () => {
      preview.textContent = '获取标题中…';
      resolvedTitle = await fetchTitle(url);
      preview.textContent = `→ 🔗 ${resolvedTitle} ↗`;
    }, 500);
  });

  cancelBtn.addEventListener('click', () => row.remove());

  confirmBtn.addEventListener('click', async () => {
    const url = input.value.trim();
    if (!url) return;

    // Duplicate check
    const existingLinks = entry.links || [];
    if (existingLinks.some(l => l.url === url)) {
      preview.textContent = '链接已存在';
      return;
    }

    if (!resolvedTitle) resolvedTitle = await fetchTitle(url);
    const newLinks = [...existingLinks, { url }];

    try {
      const data = await api.updateLinks(entry.common_path, newLinks);
      if (data.ok) {
        entry.links = newLinks;
        titleFetchCache.set(url, resolvedTitle);
        updateCardLinksBadge(entry);
        renderLinksBar(entry);
      } else {
        preview.textContent = `错误：${data.error}`;
      }
    } catch (e) {
      preview.textContent = `错误：${e.message}`;
    }
  });
}

function confirmDeleteLink(entry, index, bar, wrapEl) {
  // Prevent double-confirm
  if (wrapEl.querySelector('.link-confirm-row')) return;
  const delBtn = wrapEl.querySelector('button');
  delBtn.style.display = 'none';

  const confirmRow = document.createElement('span');
  confirmRow.className = 'link-confirm-row';
  confirmRow.style.cssText = 'display:inline-flex;align-items:center;gap:4px;';

  const okBtn = document.createElement('button');
  okBtn.className = 'md-header-btn primary';
  okBtn.style.cssText = 'font-size:10px;padding:1px 6px;';
  okBtn.textContent = '确认删除';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'md-header-btn';
  cancelBtn.style.cssText = 'font-size:10px;padding:1px 6px;';
  cancelBtn.textContent = '取消';

  cancelBtn.addEventListener('click', () => {
    confirmRow.remove();
    delBtn.style.display = '';
  });

  okBtn.addEventListener('click', async () => {
    const newLinks = (entry.links || []).filter((_, i) => i !== index);
    try {
      const data = await api.updateLinks(entry.common_path, newLinks);
      if (data.ok) {
        entry.links = newLinks;
        updateCardLinksBadge(entry);
        renderLinksBar(entry);
      } else {
        cancelBtn.click();
      }
    } catch { cancelBtn.click(); }
  });

  confirmRow.append(okBtn, cancelBtn);
  wrapEl.appendChild(confirmRow);
}

function updateCardLinksBadge(entry) {
  const id = getEntryId(entry);
  if (!id) return;
  const card = document.querySelector(`.doc-card[data-id="${id}"]`);
  if (!card) return;
  const badges = card.querySelector('.badges');
  if (!badges) return;
  let badge = badges.querySelector('.badge-links');
  const count = entry.links && entry.links.length;
  if (count) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'badge badge-links';
      badges.appendChild(badge);
    }
    badge.title = `${count} 个关联链接`;
    badge.textContent = `👍 ×${count}`;
  } else {
    if (badge) badge.remove();
  }
}

async function cycleImportance(entry, card) {
  const cur = entry.importance;
  const idx = IMPORTANCE_CYCLE.indexOf(cur);
  const next = IMPORTANCE_CYCLE[(idx + 1) % IMPORTANCE_CYCLE.length];
  try {
    const data = await api.setImportance(entry.common_path, next);
    if (!data.ok) return;
    entry.importance = next;
    card.classList.remove('importance-high', 'importance-medium', 'importance-low');
    if (next) card.classList.add(`importance-${next}`);
    const btn = card.querySelector('[data-action="cycle-importance"]');
    if (btn) {
      btn.outerHTML = importanceBadgeHtml(next);
      card.querySelector('[data-action="cycle-importance"]').addEventListener('click', () => cycleImportance(entry, card));
    }
  } catch (e) {
    console.error('cycleImportance failed', e);
  }
}

async function toggleDone(entry, card) {
  const newDone = !entry.done;
  try {
    const data = await api.setDone(entry.common_path, newDone);
    if (!data.ok) return;
    entry.done = newDone || undefined;
    // Update card visual
    card.classList.toggle('done', !!newDone);
    const btn = card.querySelector('[data-action="toggle-done"]');
    if (btn) {
      btn.textContent = newDone ? '✓ 已处理' : '○ 处理';
      btn.title = newDone ? '标记为未处理' : '标记为已处理';
    }
  } catch (e) {
    console.error('toggleDone failed', e);
  }
}

function getEntryId(entry) {
  if (entry._id) return entry._id;
  // Fallback: search indexData by common_path
  for (const [id, e] of Object.entries(indexData)) {
    if (e.common_path === entry.common_path) return id;
  }
  return null;
}

async function openCommitChangesDialog() {
  const btn = document.getElementById('btn-push-index');

  const fileList = document.getElementById('commit-changes-file-list');
  const result = document.getElementById('commit-changes-result');

  document.getElementById('commit-changes-dialog').classList.add('open');

  try {
    const data = await api.fetchDiffStatus();
    if (!data) throw new Error('无法获取状态');
    if (data.error) throw new Error(data.error);

    if (!data.total && !data.ahead) {
      fileList.innerHTML = '<div style="font-size:13px;color:#8c959f;padding:4px 0;">没有待提交或待推送的变更</div>';
      document.getElementById('btn-commit-changes-ok').disabled = true;
    } else {
      const GROUPS = [
        { key: 'new',        label: '新增' },
        { key: 'modified',   label: '修改' },
        { key: 'renamed',    label: '重命名' },
        { key: 'deleted',    label: '删除' },
        { key: 'conflicted', label: '冲突' },
      ];
      let html = '<div style="display:flex;flex-direction:column;gap:10px;">';
      if (data.ahead) {
        html += `<div class="commit-file-group">
          <div class="commit-file-group-title" style="color:#0969da;">待推送（${data.ahead} 个本地提交）</div>
          <div class="commit-file-item" style="background:#ddf4ff;color:#0550ae;">本地已有 ${data.ahead} 个提交尚未推送到远端</div>
        </div>`;
      }
      for (const { key, label } of GROUPS) {
        if (data[key]?.length) {
          html += `<div class="commit-file-group">
            <div class="commit-file-group-title">${label}（${data[key].length}）</div>
            ${data[key].map(f => `<div class="commit-file-item ${key}">${f}</div>`).join('')}
          </div>`;
        }
      }
      html += '</div>';
      document.getElementById('btn-commit-changes-ok').textContent = data.total ? '提交' : '推送';
      fileList.innerHTML = html;
    }
  } catch (e) {
    fileList.innerHTML = `<div style="font-size:12px;color:#cf222e;">获取状态失败：${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '↑ 提交变更';
  }
}

    if (data.warn) {
      result.style.color = '#e09b00';
      result.textContent = `⚠ ${data.warn}`;
    } else {
      result.style.color = '#1a7f37';
      result.textContent = `✓ 已移动到 ${data.dst_path}`;
      setTimeout(closeMoveDocDialog, 2000);
    }
  } catch (e) {
    result.style.color = '#cf222e';
    result.textContent = `✗ ${e.message}`;
  } finally {
    okBtn.disabled = false;
    okBtn.textContent = '确认移动';
  }
}

// ── Fast tooltip shim ─────────────────────────────────────────────────────
(function() {
  const box = document.createElement('div');
  box.id = '_tip';
  document.body.appendChild(box);
  let timer = null;

  function show(el, x, y) {
    const text = el.dataset.tip;
    if (!text) return;
    box.textContent = text;
    // Measure size before showing: temporarily make visible but still transparent
    const gap = 8;
    let top = y + gap;
    let left = x + gap;
    box.classList.remove('visible');
    box.style.display = 'block';
    const bw = box.offsetWidth, bh = box.offsetHeight;
    if (top + bh > window.innerHeight - 4) top = y - bh - gap;
    if (left + bw > window.innerWidth - 4) left = window.innerWidth - bw - 4;
    box.style.left = left + 'px';
    box.style.top = top + 'px';
    box.classList.add('visible');
  }

  function hide() {
    clearTimeout(timer);
    box.classList.remove('visible');
  }

  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) { hide(); return; }
    if (!el.dataset.tip) { hide(); return; }
    clearTimeout(timer);
    timer = setTimeout(() => show(el, e.clientX, e.clientY), 150);
  }, true);

  document.addEventListener('mousemove', e => {
    if (!box.classList.contains('visible')) return;
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    let top = e.clientY + 8, left = e.clientX + 8;
    const bw = box.offsetWidth, bh = box.offsetHeight;
    if (top + bh > window.innerHeight - 4) top = e.clientY - bh - 8;
    if (left + bw > window.innerWidth - 4) left = window.innerWidth - bw - 4;
    box.style.left = left + 'px';
    box.style.top = top + 'px';
  }, true);

  document.addEventListener('mouseout', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    if (el.contains(e.relatedTarget)) return;
    clearTimeout(timer);
    hide();
  }, true);
})();
