<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuLu Workbench</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%230969da'/%3E%3Cstop offset='100%25' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='19' font-family='system-ui,sans-serif' font-weight='700' fill='white'%3EW%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown/dist/turndown.min.js"></script>
<link rel="stylesheet" href="app.css?v=20260507c">
</head>
<body>

<header>
  <h1>LuLu Workbench</h1>
  <div id="gs-wrap">
    <span id="gs-mode-pill" style="display:none">Workbench</span>
    <input id="gs-input" type="text" placeholder="搜索知识库…" autocomplete="off" spellcheck="false" />
    <button id="gs-rebuild-btn" class="gs-rebuild-btn" style="display:none" title="重建 Workbench 索引">↺</button>
    <button id="gs-kb-rebuild-btn" class="gs-rebuild-btn" style="display:none" title="重建知识库索引">↺</button>
    <div id="gs-dropdown" style="display:none"></div>
  </div>
  <a href="https://github.com/lulufoo/lulu-workbench" target="_blank">GitHub ↗</a>
  <div id="repo-menu-wrap">
    <button id="btn-repo-menu">⚙ 知识库</button>
    <div id="repo-menu-dropdown">
      <button id="btn-repo-list">☰ 查看列表</button>
      <button id="btn-repo-full-sync">⊙ 全量同步</button>
    </div>
  </div>
  <div id="sync-menu-wrap">
    <button id="btn-sync-menu">⇕ 同步</button>
    <div id="sync-menu-dropdown">
      <button id="btn-push-index">↑ 提交变更</button>
      <button id="btn-pull">↓ 更新项目</button>
    </div>
  </div>
  <div id="tools-menu-wrap">
    <button id="btn-tools-menu">⛓ 工具</button>
    <div id="tools-menu-dropdown">
      <button id="btn-move-doc-header">→ 移动</button>
      <button id="btn-feed">📡 Builders</button>
      <button id="btn-base64">🔤 Base64</button>
    </div>
  </div>
  <div id="skills-menu-wrap">
    <button id="btn-skills-menu">✦ SKILL</button>
    <div id="skills-menu-dropdown">
      <button id="btn-skill-workbench">Lulu Workbench Skills</button>
      <button id="btn-skill-lulu">Lulu Skills</button>
      <button id="btn-skill-software-dev">Software Dev Skills</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <div style="padding:12px 16px;font-size:11px;color:#8c959f;">加载中…</div>
  </aside>
  <main id="main">
    <div id="status"><div style="color:#8c959f;font-size:13px;">← 选择日期查看文档</div></div>
    <div id="date-heading" style="display:none"></div>
    <div id="doc-list" class="doc-list"></div>
    <div id="feed-view" style="display:none;padding:20px;overflow-y:auto;height:100%;box-sizing:border-box;"></div>
  </main>
</div>

<!-- Base64 tool dialog -->
<div id="base64-dialog">
  <div id="base64-dialog-box">
    <div id="base64-dialog-header">
      <span>🔤 Base64 转换</span>
      <button id="btn-base64-close">✕ 关闭</button>
    </div>
    <textarea id="base64-input" placeholder="输入文本或 Base64 字符串…" spellcheck="false"></textarea>
    <div id="base64-dialog-actions">
      <button id="btn-base64-encode">编码 →</button>
      <button id="btn-base64-decode">← 解码</button>
    </div>
    <textarea id="base64-output" readonly placeholder="结果…" spellcheck="false"></textarea>
    <div id="base64-dialog-footer">
      <button id="btn-base64-copy">复制结果</button>
    </div>
  </div>
</div>

<!-- KB Viewer -->
<div id="kb-md-modal" class="viewer-modal" style="display:none">
  <div id="kb-md-backdrop" class="viewer-backdrop"></div>
  <div id="kb-md-panel" class="viewer-panel">
    <div id="kb-md-header" class="viewer-header">
      <span id="kb-md-panel-title" class="viewer-panel-title"></span>
      <span id="kb-md-file-size" style="font-size:10px;color:#8c959f;flex-shrink:0;"></span>
      <a id="kb-md-github-link" href="#" target="_blank" style="font-size:12px;color:#0969da;text-decoration:none;flex-shrink:0;">GitHub ↗</a>
      <button class="md-header-btn" id="kb-btn-open-iterm" style="display:none" title="在 iTerm 中打开仓库目录">⌨️ 终端</button>
      <button class="md-header-btn" id="kb-btn-copy-http" data-tip="">&#127760;</button>
      <button class="md-header-btn" id="kb-btn-copy-path" data-tip="">&#128194;</button>
      <button class="md-header-btn" id="kb-btn-edit">✏️ 编辑</button>
      <button class="md-header-btn" id="kb-btn-add-comment">💬 笔记</button>
      <button class="md-header-btn primary" id="kb-btn-save" style="display:none">💾 保存</button>
      <button class="md-header-btn" id="kb-btn-cancel-edit" style="display:none">取消</button>
      <button id="kb-btn-pending" class="md-header-btn" style="display:none">● 待提交</button>
      <button id="kb-md-close" class="md-header-btn viewer-close">✕ 关闭</button>
    </div>
    <div id="kb-md-links-bar" style="display:none;padding:8px 20px;border-bottom:1px solid #d0d7de;display:flex;align-items:center;flex-wrap:wrap;gap:4px 0;"></div>
    <div id="kb-md-content-row" class="viewer-content-row">
      <div id="kb-md-body" class="viewer-body"></div>
      <textarea id="kb-md-edit-area" class="viewer-edit-area" style="display:none" spellcheck="false"></textarea>
      <div id="kb-comment-float-nav"></div>
    </div>
  </div>
</div>

<!-- KB Commit dialog -->
<div id="kb-commit-dialog">
  <div id="kb-commit-dialog-box">
    <div id="kb-commit-dialog-title">
      <h3>● 提交变更</h3>
      <button id="kb-btn-revert-all">撤销全部修改</button>
    </div>
    <div id="kb-commit-file-list"></div>
    <input id="kb-commit-msg" type="text" placeholder="chore: update via viewer" />
    <div id="kb-commit-dialog-actions">
      <span id="kb-commit-result"></span>
      <button id="kb-btn-commit-cancel" class="md-header-btn">取消</button>
      <button id="kb-btn-commit-ok" class="md-header-btn primary">提交</button>
    </div>
  </div>
</div>

<!-- KB Comment dialog -->
<div id="kb-comment-dialog">
  <div id="kb-comment-dialog-box">
    <div id="kb-comment-dialog-header">
      <h3 id="kb-comment-dialog-title">💬 添加笔记</h3>
    </div>
    <div id="kb-comment-editor-box" class="comment-editor-box" onclick="document.getElementById('kb-comment-dialog-content').focus()">
      <div id="kb-comment-dialog-content" class="comment-editor-content" contenteditable="true" data-placeholder="输入笔记内容…（Ctrl/Cmd+Enter 保存）"></div>
    </div>
    <div id="kb-comment-dialog-actions">
      <button id="kb-btn-comment-cancel" class="md-header-btn">取消</button>
      <button id="kb-btn-comment-save" class="md-header-btn primary">保存</button>
    </div>
  </div>
</div>

<!-- MD Viewer -->
<div id="md-modal" class="viewer-modal" style="display:none">
  <div id="md-backdrop" class="viewer-backdrop"></div>
  <div id="md-panel" class="viewer-panel">
    <div id="md-header" class="viewer-header">
      <span id="md-panel-title" class="viewer-panel-title"></span>
      <div id="md-lang-bar" style="display:none;flex-shrink:0;align-items:center;gap:2px;">
        <button class="md-header-btn" id="btn-lang-en">EN</button>
        <button class="md-header-btn" id="btn-lang-zh">ZH</button>
      </div>
      <span id="md-file-size" style="font-size:10px;color:#8c959f;flex-shrink:0;"></span>
      <a id="md-github-link" href="#" target="_blank" style="font-size:12px;color:#0969da;text-decoration:none;flex-shrink:0;">GitHub ↗</a>
      <button class="md-header-btn" id="btn-goto-kb" style="display:none" title="跳转知识库">📚 知识库</button>
      <button class="md-header-btn" id="btn-open-iterm" style="display:none" title="在 iTerm 中打开仓库目录">⌨️ 终端</button>
      <button class="md-header-btn" id="btn-copy-http" data-tip="">&#127760;</button>
      <button class="md-header-btn" id="btn-copy-path" data-tip="">&#128194;</button>
      <button class="md-header-btn" id="btn-edit">✏️ 编辑</button>
      <button class="md-header-btn" id="btn-add-comment">💬 笔记</button>
      <button class="md-header-btn primary" id="btn-save" style="display:none">💾 保存</button>
      <button class="md-header-btn" id="btn-cancel-edit" style="display:none">取消</button>
      <button class="md-header-btn" id="btn-panel-commit" style="display:none">● 提交此文件</button>
      <button id="md-close" class="md-header-btn viewer-close">✕ 关闭</button>
    </div>
    <div id="md-commit-bar" class="viewer-commit-bar">
      <span style="font-size:12px;color:#7d4e00;flex-shrink:0;">● 待提交：</span>
      <input id="md-commit-msg" type="text" placeholder="update: edit via viewer" />
      <button id="btn-commit-file" class="md-header-btn primary" style="font-size:11px;padding:3px 10px;">↑ 提交</button>
      <button id="btn-skip-commit" class="md-header-btn" style="font-size:11px;padding:3px 10px;">稍后</button>
      <span id="md-commit-result" style="font-size:11px;"></span>
    </div>
    <div id="md-links-bar" style="display:none;padding:8px 20px;border-bottom:1px solid #d0d7de;display:flex;align-items:center;flex-wrap:wrap;gap:4px 0;"></div>
    <div id="md-content-row" class="viewer-content-row">
      <div id="md-body" class="viewer-body"></div>
      <textarea id="md-edit-area" class="viewer-edit-area" style="display:none" spellcheck="false"></textarea>
      <div id="knowledge-panel" class="ks-collapsed"></div>
      <div id="comment-float-nav"></div>
    </div>
  </div>
</div>

<!-- Floating highlight button -->
<button id="highlight-add-btn" class="viewer-highlight-btn" style="display:none;position:fixed;z-index:9999;">高亮</button>
<!-- KB Floating highlight button -->
<button id="kb-highlight-add-btn" class="viewer-highlight-btn" style="display:none;position:fixed;z-index:9999;">高亮</button>
<!-- Comment preview tooltip -->
<div id="comment-preview-tip"></div>

<!-- Comment dialog -->
<div id="comment-dialog">
  <div id="comment-dialog-box">
    <div id="comment-dialog-header">
      <h3 id="comment-dialog-title">💬 添加笔记</h3>
      <div id="comment-dialog-tabs">
        <button class="comment-tab-btn active" data-tab="edit">编辑</button>
        <button class="comment-tab-btn" data-tab="preview">预览</button>
      </div>
    </div>
    <div id="comment-editor-box" class="comment-editor-box" onclick="document.getElementById('comment-dialog-content').focus()">
      <div id="comment-dialog-content" class="comment-editor-content" contenteditable="true" data-placeholder="输入笔记内容…（Ctrl/Cmd+Enter 保存）"></div>
    </div>
    <div id="comment-preview-pane" class="md-body" style="display:none"></div>
    <div id="comment-dialog-actions">
      <button id="btn-comment-cancel" class="md-header-btn">取消</button>
      <button id="btn-comment-save" class="md-header-btn primary">保存</button>
    </div>
  </div>
</div>

<!-- Commit changes dialog -->
<div id="commit-changes-dialog">
  <div id="commit-changes-dialog-box">
    <h3>↑ 提交变更</h3>
    <div id="commit-changes-file-list"></div>
    <input id="commit-changes-msg" type="text" placeholder="提交信息（留空：chore: update via viewer）" autocomplete="off" />
    <div id="commit-changes-dialog-actions">
      <span id="commit-changes-result"></span>
      <button id="btn-commit-changes-cancel">取消</button>
      <button id="btn-commit-changes-ok">提交</button>
    </div>
  </div>
</div>

<!-- Repo list dialog -->
<div id="repo-list-dialog">
  <div id="repo-list-dialog-box">
    <div id="repo-list-dialog-header">
      <div id="repo-list-title-group">
        <h3>☰ 仓库列表</h3>
        <button id="btn-repo-list-refresh" title="刷新">⟳</button>
        <span id="repo-list-cache-time"></span>
      </div>
      <select id="repo-list-filter"></select>
    </div>
    <div id="repo-list-content"></div>
    <div id="repo-list-dialog-actions">
      <button id="btn-repo-list-close" class="md-header-btn">关闭</button>
    </div>
  </div>
</div>

<!-- Move doc dialog -->
<div id="move-doc-dialog">
  <div id="move-doc-dialog-box">
    <h3>→ 移动 GitHub 文件 / 目录</h3>
    <div class="move-doc-field">
      <label>源 URL（文件用 blob 链接，目录用 tree 链接）</label>
      <input id="move-src-url" type="text" placeholder="blob: …/blob/main/dir/file.md   或   tree: …/tree/main/dir" autocomplete="off" spellcheck="false" />
    </div>
    <div class="move-doc-field">
      <label>目标目录 URL（GitHub 目录链接）</label>
      <input id="move-dst-url" type="text" placeholder="https://github.com/owner/repo/subdir" autocomplete="off" spellcheck="false" />
    </div>
    <div id="move-doc-result"></div>
    <div id="move-doc-dialog-actions">
      <button id="btn-move-doc-cancel" class="md-header-btn">取消</button>
      <button id="btn-move-doc-ok" class="md-header-btn primary">确认移动</button>
    </div>
  </div>
</div>

<!-- Delete confirm dialog -->
<div id="delete-dialog">
  <div id="delete-dialog-box">
    <h3>⚠️ 删除文档</h3>
    <p id="delete-dialog-desc">将删除此条目的所有关联文件（raw / distilled / trace / digest）并从 index.json 移除，<strong>不可撤销</strong>。</p>
    <div id="delete-dialog-confirm-row">
      输入 <code>CONFIRM</code> 确认删除
      <button id="btn-copy-confirm-word" title="复制 CONFIRM">复制</button>
    </div>
    <input id="delete-confirm-input" type="text" placeholder="在此输入 CONFIRM" autocomplete="off" />
    <div id="delete-dialog-actions">
      <button id="btn-delete-cancel">取消</button>
      <button id="btn-delete-confirm-ok" disabled>确认删除</button>
    </div>
  </div>
</div>

<!-- Move project dialog -->
<div id="move-project-dialog">
  <div id="move-project-backdrop"></div>
  <div id="move-project-dialog-box">
    <h3>↷ 切换项目</h3>
    <div id="move-project-result" style="font-size:12px;color:#57606a;margin-bottom:8px;"></div>
    <div id="move-project-list" style="display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto;"></div>
    <div id="move-project-dialog-actions">
      <button id="btn-move-project-close">取消</button>
    </div>
  </div>
</div>

<!-- Settle dialog -->
<div id="settle-dialog">
  <div id="settle-dialog-box">
    <h3>⬆ 沉淀到知识仓库</h3>
    <div class="settle-field">
      <label>目标仓库</label>
      <span id="settle-repo-display"></span>
    </div>
    <div class="settle-field">
      <label>目标目录（doc-theme）</label>
      <select id="settle-theme-select"></select>
      <input id="settle-theme-input" type="text" placeholder="输入新目录名（kebab-case）" autocomplete="off" style="display:none" />
    </div>
    <div class="settle-field">
      <label>文件名</label>
      <div class="settle-filename-row">
        <span class="settle-filename-ts" id="settle-filename-ts"></span><span class="settle-filename-dash">-</span><input id="settle-slug" type="text" placeholder="输入名称" autocomplete="off" spellcheck="false" /><span class="settle-filename-ext">.md</span>
      </div>
      <div id="settle-file-warn"></div>
    </div>
    <div class="settle-field">
      <label>正文</label>
      <textarea id="settle-content" rows="10"></textarea>
    </div>
    <div id="settle-result"></div>
    <div id="settle-dialog-actions">
      <button id="btn-settle-cancel" class="md-header-btn">取消</button>
      <button id="btn-settle-submit" class="md-header-btn primary">推送</button>
    </div>
  </div>
</div>

<!-- Skills dialog -->
<div id="skills-dialog">
  <div id="skills-dialog-box">
    <div id="skills-dialog-header">
      <h3 id="skills-dialog-title"></h3>
      <button id="btn-skills-dialog-close" class="md-header-btn">✕ 关闭</button>
    </div>
    <div id="skills-dialog-body"></div>
  </div>
</div>

<script type="module" src="js/main.js?v=20260506f"></script>
</body>
</html>
