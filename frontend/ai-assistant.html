<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办助手</title>
<link rel="icon" type="image/svg+xml" href="icons/app-icon.svg">
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f2;
    --panel: #ffffff;
    --border: #ddd8cf;
    --text: #1f1c18;
    --muted: #6b655c;
    --user: #e8f0ea;
    --assistant: #f0eeea;
    --notice: #fff6e5;
    --accent: #2f6f4e;
    --danger: #8a2f2f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "SF Pro Text", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #ai-assistant-root {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .ai-assistant-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .ai-assistant-title {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
  }
  .ai-assistant-bound {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .ai-assistant-messages {
    flex: 1;
    overflow: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ai-assistant-bubble {
    max-width: 92%;
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ai-assistant-bubble--user {
    align-self: flex-end;
    background: var(--user);
  }
  .ai-assistant-bubble--assistant {
    align-self: flex-start;
    background: var(--assistant);
  }
  .ai-assistant-bubble--notice {
    align-self: center;
    background: var(--notice);
    color: var(--muted);
    font-size: 12px;
  }
  .ai-assistant-bubble--error {
    color: var(--danger);
  }
  .ai-assistant-composer {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .ai-assistant-input {
    flex: 1;
    min-height: 40px;
    max-height: 120px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
  }
  .ai-assistant-send {
    border: none;
    border-radius: 8px;
    padding: 0 14px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  .ai-assistant-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div id="ai-assistant-root"></div>
<script type="module" src="js/ai-assistant.js"></script>
</body>
</html>
