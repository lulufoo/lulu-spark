<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lulu Spark</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%23576AE0'/%3E%3Cpath d='M8 8h7v9h9v7H8z' fill='%23f5f5f7'/%3E%3Crect x='18' y='8' width='6' height='6' rx='1.5' fill='%23FF5A4E'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/consent.css">
</head>
<body>
<header class="top">
<div class="wrap top-inner">
<div class="brand">
<svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
<rect x="2" y="2" width="28" height="28" rx="8" fill="#576AE0"/>
<path d="M8 8h7v9h9v7H8z" fill="#f5f5f7"/>
<rect x="18" y="8" width="6" height="6" rx="1.5" fill="#FF5A4E"/>
</svg>
<p class="wordmark">Lulu Spark</p>
</div>
<p class="chip"><i></i>Signed in</p>
</div>
</header>
<main>
<div class="wrap stage">
<section class="intro">
<p class="kicker">MCP authorization</p>
<h1>Allow Codex to connect?</h1>
<p class="lead">Codex wants to use Lulu Spark as an MCP client. Review the access, then allow or deny.</p>
</section>
<section class="card">
<dl class="grant">
<div>
<dt>Client</dt>
<dd>Codex</dd>
</div>
<div>
<dt>Access</dt>
<dd>Call MCP tools on this Spark</dd>
</div>
<div>
<dt>Session</dt>
<dd>Stays until you revoke it</dd>
</div>
</dl>
<div class="actions" id="actions">
<button type="button" class="go" id="allow">Allow</button>
<button type="button" class="hold" id="deny">Deny</button>
</div>
<p class="note" id="note" hidden></p>
</section>
</div>
</main>
<script src="js/consent.js"></script>
</body>
</html>
